<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Costco 상품 가격 비교 | 현재가, 기준가, 할인율 이력</title>
  <meta name="description" content="Costco 상품의 현재가, 기준가, 할인율과 가격 이력을 한 화면에서 검색, 필터, 정렬해 비교합니다.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0f766e">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="Costco 상품 가격 비교">
  <meta property="og:description" content="Costco 상품의 현재가, 기준가, 할인율과 가격 이력을 검색하고 비교합니다.">
  <meta property="og:site_name" content="Costco 상품 가격">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Costco 상품 가격 비교">
  <meta name="twitter:description" content="Costco 상품의 현재가, 기준가, 할인율과 가격 이력을 검색하고 비교합니다.">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Costco 상품 가격 비교",
      "applicationCategory": "ShoppingApplication",
      "operatingSystem": "Any",
      "inLanguage": "ko-KR",
      "description": "Costco 상품의 현재가, 기준가, 할인율과 가격 이력을 검색하고 비교하는 정적 웹 애플리케이션입니다."
    }
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fa;
      --surface: #ffffff;
      --surface-2: #eef3f7;
      --text: #17212b;
      --muted: #627082;
      --line: #d8e0e8;
      --accent: #0f766e;
      --accent-2: #c2410c;
      --ok: #137333;
      --warn: #b45309;
      --bad: #b91c1c;
      --shadow: 0 10px 30px rgba(23, 33, 43, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      min-height: 40px;
      padding: 0 12px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      padding: 0 11px;
    }

    .shell {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 18px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 18px 0 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 36px);
      letter-spacing: 0;
      line-height: 1.1;
    }

    .meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1.4fr) repeat(5, minmax(120px, 0.6fr)) auto;
      gap: 10px;
      align-items: end;
      margin: 12px 0 18px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat {
      min-height: 78px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .stat strong {
      display: block;
      margin-top: 8px;
      font-size: 24px;
      line-height: 1;
    }

    .status {
      display: flex;
      gap: 10px;
      align-items: center;
      min-height: 44px;
      margin-bottom: 14px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 14px;
    }

    .status.error {
      border-color: #fecaca;
      background: #fff1f2;
      color: var(--bad);
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #cbd5e1;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex: 0 0 auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    table {
      width: 100%;
      min-width: 940px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f8fafc;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .sort-button {
      display: inline-flex;
      justify-content: inherit;
      align-items: center;
      gap: 6px;
      width: 100%;
      min-height: auto;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-weight: inherit;
      text-align: inherit;
    }

    .sort-button::after {
      content: "↕";
      color: #94a3b8;
      font-size: 11px;
    }

    .sort-button[aria-sort="ascending"]::after {
      content: "↑";
      color: var(--accent);
    }

    .sort-button[aria-sort="descending"]::after {
      content: "↓";
      color: var(--accent);
    }

    tbody tr:hover {
      background: #f8fafc;
    }

    .product {
      display: grid;
      grid-template-columns: 54px minmax(220px, 1fr);
      gap: 10px;
      align-items: center;
      color: inherit;
      text-decoration: none;
    }

    .product:hover .name {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .thumb {
      width: 54px;
      height: 54px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #eef2f6;
      object-fit: cover;
    }

    .thumb.missing {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 11px;
    }

    .name {
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    .code {
      margin-top: 2px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }

    .num {
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 0 9px;
      border-radius: 999px;
      background: #e8f5e9;
      color: var(--ok);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .chip.off {
      background: #fee2e2;
      color: var(--bad);
    }

    .chip.dim {
      background: #eef2f7;
      color: var(--muted);
    }

    .delta.up {
      color: var(--bad);
      font-weight: 800;
    }

    .delta.down {
      color: var(--ok);
      font-weight: 800;
    }

    .history-button {
      min-height: 34px;
      padding: 0 10px;
      white-space: nowrap;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(15, 23, 42, 0.45);
    }

    .modal[hidden] {
      display: none;
    }

    .dialog {
      width: min(920px, 100%);
      max-height: min(760px, calc(100vh - 36px));
      overflow: hidden;
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.28);
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .dialog-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .dialog-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
    }

    .dialog-subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .dialog-body {
      overflow: auto;
      padding: 0;
    }

    .chart-panel {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--line);
    }

    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .legend-item {
      display: inline-flex;
      gap: 6px;
      align-items: center;
    }

    .legend-swatch {
      width: 18px;
      height: 3px;
      border-radius: 999px;
      background: var(--accent);
    }

    .legend-swatch.base {
      background: var(--accent-2);
    }

    .history-chart {
      width: 100%;
      height: 260px;
      display: block;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfdff;
    }

    .history-table {
      min-width: 620px;
      box-shadow: none;
    }

    .history-table th,
    .history-table td {
      padding: 10px 14px;
    }

    .pager {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .pager-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .empty {
      padding: 52px 16px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .topbar,
      .toolbar,
      .stats {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: stretch;
      }
    }

    @media (max-width: 560px) {
      .shell {
        padding: 12px;
      }

      .toolbar {
        padding: 12px;
      }

      .pager {
        align-items: stretch;
        flex-direction: column;
      }

      .pager-controls {
        width: 100%;
      }

      .pager-controls button {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>Costco 상품 가격</h1>
        <div class="meta" id="meta">데이터를 불러오는 중입니다.</div>
      </div>
      <button class="primary" id="reloadButton" type="button">새로고침</button>
    </header>

    <section class="toolbar" aria-label="상품 필터">
      <div class="field">
        <label for="searchInput">검색</label>
        <input id="searchInput" type="search" placeholder="상품명 또는 코드">
      </div>
      <div class="field">
        <label for="stockFilter">재고</label>
        <select id="stockFilter">
          <option value="all">전체</option>
          <option value="in" selected>재고 있음</option>
          <option value="out">품절</option>
        </select>
      </div>
      <div class="field">
        <label for="minPriceInput">현재가 최소</label>
        <input id="minPriceInput" type="number" min="0" step="100" inputmode="numeric" value="0" required>
      </div>
      <div class="field">
        <label for="maxPriceInput">현재가 최대</label>
        <input id="maxPriceInput" type="number" min="0" step="100" inputmode="numeric" required>
      </div>
      <div class="field">
        <label for="sortSelect">정렬</label>
        <select id="sortSelect">
          <option value="name">상품명</option>
          <option value="basePriceDesc">기준가 높은순</option>
          <option value="basePriceAsc">기준가 낮은순</option>
          <option value="priceDesc">가격 높은순</option>
          <option value="priceAsc">가격 낮은순</option>
          <option value="discountDesc" selected>기준가 대비 할인순</option>
          <option value="stockDesc">재고 있음 우선</option>
        </select>
      </div>
      <div class="field">
        <label for="pageSizeSelect">표시 개수</label>
        <select id="pageSizeSelect">
          <option value="30">30개</option>
          <option value="60" selected>60개</option>
          <option value="120">120개</option>
        </select>
      </div>
      <button id="resetButton" type="button">초기화</button>
    </section>

    <section class="stats" aria-label="요약">
      <div class="stat"><span>상품</span><strong id="productCount">0</strong></div>
      <div class="stat"><span>재고 있음</span><strong id="stockCount">0</strong></div>
      <div class="stat"><span>가격 있음</span><strong id="priceCount">0</strong></div>
      <div class="stat"><span>기준가 대비 할인</span><strong id="discountCount">0</strong></div>
    </section>

    <div class="status" id="status"><span class="spinner"></span><span>products, prices, basePrices를 가져오고 있습니다.</span></div>

    <section class="table-wrap" aria-label="상품 가격 목록">
      <table>
        <thead>
          <tr>
            <th><button class="sort-button" type="button" data-sort-key="name">상품</button></th>
            <th class="num"><button class="sort-button" type="button" data-sort-key="basePrice">기준가</button></th>
            <th class="num"><button class="sort-button" type="button" data-sort-key="price">현재가</button></th>
            <th class="num"><button class="sort-button" type="button" data-sort-key="discountRate">할인율</button></th>
            <th><button class="sort-button" type="button" data-sort-key="stock">재고</button></th>
            <th>이력</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden>조건에 맞는 상품이 없습니다.</div>
    </section>

    <nav class="pager" aria-label="페이지">
      <div id="pageInfo">0개</div>
      <div class="pager-controls">
        <button id="prevButton" type="button">이전</button>
        <button id="nextButton" type="button">다음</button>
      </div>
    </nav>
  </main>

  <div class="modal" id="historyModal" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
      <header class="dialog-head">
        <div>
          <h2 class="dialog-title" id="historyTitle">가격 이력</h2>
          <div class="dialog-subtitle" id="historySubtitle"></div>
        </div>
        <button id="historyCloseButton" type="button">닫기</button>
      </header>
      <div class="dialog-body">
        <div class="chart-panel">
          <div class="chart-legend">
            <span class="legend-item"><span class="legend-swatch base"></span>기준가</span>
            <span class="legend-item"><span class="legend-swatch"></span>현재가</span>
          </div>
          <div id="historyChart"></div>
        </div>
        <table class="history-table">
          <thead>
            <tr>
              <th>시각</th>
              <th class="num">기준가</th>
              <th class="num">현재가</th>
              <th class="num">할인율</th>
            </tr>
          </thead>
          <tbody id="historyRows"></tbody>
        </table>
        <div class="empty" id="historyEmpty" hidden>가격 이력이 없습니다.</div>
      </div>
    </section>
  </div>

  <script>
    "use strict";

    const SOURCES = {
      products: {
        csv: "https://docs.google.com/spreadsheets/d/1JhhzwsnZoQjzd1xksaqnNjuk2oVc5tjrCPbxNcWAUsk/gviz/tq?tqx=out:csv&sheet=products",
        columns: ["code", "name", "image", "stock"]
      },
      prices: {
        csv: "https://docs.google.com/spreadsheets/d/1JhhzwsnZoQjzd1xksaqnNjuk2oVc5tjrCPbxNcWAUsk/gviz/tq?tqx=out:csv&sheet=prices",
        columns: ["code", "price", "timestamp"]
      },
      basePrices: {
        csv: "https://docs.google.com/spreadsheets/d/1JhhzwsnZoQjzd1xksaqnNjuk2oVc5tjrCPbxNcWAUsk/gviz/tq?tqx=out:csv&sheet=basePrices",
        columns: ["code", "basePrice", "timestamp"]
      }
    };

    const state = {
      products: [],
      rows: [],
      filtered: [],
      priceHistory: new Map(),
      basePriceHistory: new Map(),
      page: 1,
      pageSize: 60,
      sortKey: "discountRate",
      sortDir: "desc",
      defaultMaxPrice: 0,
      restoredHistoryCode: "",
      isRestoring: true,
      loadedAt: null
    };

    const els = {
      meta: document.getElementById("meta"),
      status: document.getElementById("status"),
      rows: document.getElementById("rows"),
      empty: document.getElementById("empty"),
      productCount: document.getElementById("productCount"),
      stockCount: document.getElementById("stockCount"),
      priceCount: document.getElementById("priceCount"),
      discountCount: document.getElementById("discountCount"),
      searchInput: document.getElementById("searchInput"),
      stockFilter: document.getElementById("stockFilter"),
      minPriceInput: document.getElementById("minPriceInput"),
      maxPriceInput: document.getElementById("maxPriceInput"),
      sortSelect: document.getElementById("sortSelect"),
      pageSizeSelect: document.getElementById("pageSizeSelect"),
      pageInfo: document.getElementById("pageInfo"),
      prevButton: document.getElementById("prevButton"),
      nextButton: document.getElementById("nextButton"),
      reloadButton: document.getElementById("reloadButton"),
      resetButton: document.getElementById("resetButton"),
      historyModal: document.getElementById("historyModal"),
      historyTitle: document.getElementById("historyTitle"),
      historySubtitle: document.getElementById("historySubtitle"),
      historyChart: document.getElementById("historyChart"),
      historyRows: document.getElementById("historyRows"),
      historyEmpty: document.getElementById("historyEmpty"),
      historyCloseButton: document.getElementById("historyCloseButton"),
      sortButtons: document.querySelectorAll("[data-sort-key]")
    };

    const moneyFormatter = new Intl.NumberFormat("ko-KR", {
      style: "currency",
      currency: "KRW",
      maximumFractionDigits: 0
    });

    const numberFormatter = new Intl.NumberFormat("ko-KR");
    const dateFormatter = new Intl.DateTimeFormat("ko-KR", {
      timeZone: "Asia/Seoul",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    });

    function setStatus(message, isError) {
      els.status.className = isError ? "status error" : "status";
      els.status.innerHTML = isError
        ? "<span>" + escapeHtml(message) + "</span>"
        : "<span class=\"spinner\"></span><span>" + escapeHtml(message) + "</span>";
    }

    function setReadyStatus(message) {
      els.status.className = "status";
      els.status.innerHTML = "<span>" + escapeHtml(message) + "</span>";
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let value = "";
      let quoted = false;

      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        const next = text[i + 1];

        if (quoted) {
          if (char === "\"" && next === "\"") {
            value += "\"";
            i += 1;
          } else if (char === "\"") {
            quoted = false;
          } else {
            value += char;
          }
        } else if (char === "\"") {
          quoted = true;
        } else if (char === ",") {
          row.push(value);
          value = "";
        } else if (char === "\n") {
          row.push(value);
          rows.push(row);
          row = [];
          value = "";
        } else if (char !== "\r") {
          value += char;
        }
      }

      if (value.length || row.length) {
        row.push(value);
        rows.push(row);
      }

      return rows.filter((item) => item.some((cell) => cell.trim() !== ""));
    }

    function rowsToObjects(rows, fallbackColumns) {
      if (!rows.length) return [];
      const first = rows[0].map((header) => String(header || "").trim().replace(/\s+/g, "").toLowerCase());
      const hasHeader = fallbackColumns.every((column) => first.includes(column.toLowerCase()));
      const headers = hasHeader
        ? rows[0].map((header) => String(header || "").trim())
        : fallbackColumns;
      const dataRows = hasHeader ? rows.slice(1) : rows;

      return dataRows.map((row) => {
        const item = {};
        headers.forEach((header, index) => {
          item[header] = (row[index] || "").trim();
        });
        return item;
      });
    }

    async function loadCsvSource(key) {
      const source = SOURCES[key];
      const response = await fetch(source.csv, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(key + " CSV 응답 오류: " + response.status);
      }
      const text = await response.text();
      return rowsToObjects(parseCsv(text), source.columns);
    }

    async function loadAll() {
      setStatus("products, prices, basePrices를 가져오고 있습니다.", false);
      els.reloadButton.disabled = true;

      try {
        const [products, prices, basePrices] = await Promise.all([
          loadCsvSource("products"),
          loadCsvSource("prices"),
          loadCsvSource("basePrices")
        ]);
        applyLoadedData(products, prices, basePrices);
      } catch (error) {
        setStatus("데이터를 불러오지 못했습니다. " + error.message, true);
        els.meta.textContent = "로드 실패";
        console.error(error);
      } finally {
        els.reloadButton.disabled = false;
      }
    }

    function applyLoadedData(products, prices, basePrices) {
      const latestPrices = latestByCode(prices, "price");
      const latestBasePrices = latestByCode(basePrices, "basePrice");
      state.priceHistory = historyByCode(prices, "price");
      state.basePriceHistory = historyByCode(basePrices, "basePrice");

      state.products = products;
      state.rows = products.map((product) => {
        const code = cleanCode(product.code);
        const price = latestPrices.get(code);
        const basePrice = latestBasePrices.get(code);
        const currentPrice = price ? toNumber(price.price) : null;
        const currentBasePrice = basePrice ? toNumber(basePrice.basePrice) : null;

        return {
          code,
          name: product.name || "(이름 없음)",
          image: product.image || "",
          stock: product.stock || "",
          inStock: isInStock(product.stock),
          price: currentPrice,
          priceTimestamp: price ? parseDate(price.timestamp) : null,
          basePrice: currentBasePrice,
          basePriceTimestamp: basePrice ? parseDate(basePrice.timestamp) : null,
          delta: currentPrice !== null && currentBasePrice !== null ? currentPrice - currentBasePrice : null,
          discountRate: currentPrice !== null && currentBasePrice > 0
            ? ((currentBasePrice - currentPrice) / currentBasePrice) * 100
            : null
        };
      });

      state.loadedAt = new Date();
      state.defaultMaxPrice = Math.max(0, ...state.rows.map((row) => row.price || 0));
      setDefaultPriceRange();
      restoreStateFromUrl();
      updateStats();
      applyFilters();
      if (state.restoredHistoryCode) openHistory(state.restoredHistoryCode, false);
      state.isRestoring = false;
      updateUrlState();
      setReadyStatus("로드 완료: Google Sheets CSV 데이터를 표시 중입니다.");
      els.meta.textContent = "마지막 업데이트 " + dateFormatter.format(state.loadedAt);
    }

    function latestByCode(rows, valueKey) {
      const map = new Map();
      rows.forEach((row) => {
        const code = cleanCode(row.code);
        if (!code || toNumber(row[valueKey]) === null) return;
        const current = map.get(code);
        const nextDate = parseDate(row.timestamp);
        const currentDate = current ? parseDate(current.timestamp) : null;
        if (!current || compareDates(nextDate, currentDate) >= 0) {
          map.set(code, row);
        }
      });
      return map;
    }

    function historyByCode(rows, valueKey) {
      const map = new Map();
      rows.forEach((row) => {
        const code = cleanCode(row.code);
        const value = toNumber(row[valueKey]);
        const timestamp = parseDate(row.timestamp);
        if (!code || value === null || !timestamp) return;
        if (!map.has(code)) map.set(code, []);
        map.get(code).push({ value, timestamp });
      });
      map.forEach((items) => {
        items.sort((a, b) => compareDates(b.timestamp, a.timestamp));
      });
      return map;
    }

    function cleanCode(value) {
      return String(value || "").trim();
    }

    function toNumber(value) {
      const cleaned = String(value || "").replace(/[^\d.-]/g, "");
      if (!cleaned) return null;
      const number = Number(cleaned);
      return Number.isFinite(number) ? number : null;
    }

    function parseDate(value) {
      if (!value) return null;
      if (value instanceof Date) return value;
      const numeric = Number(String(value).trim());
      if (Number.isFinite(numeric)) {
        const milliseconds = numeric > 100000000000 ? numeric : numeric * 1000;
        const numericDate = new Date(milliseconds);
        if (!Number.isNaN(numericDate.getTime())) return numericDate;
      }
      const date = new Date(value);
      if (!Number.isNaN(date.getTime())) return date;

      const normalized = String(value).replace(/\./g, "-").replace(/\s+/g, " ").trim();
      const fallback = new Date(normalized);
      return Number.isNaN(fallback.getTime()) ? null : fallback;
    }

    function compareDates(a, b) {
      const at = a ? a.getTime() : 0;
      const bt = b ? b.getTime() : 0;
      return at - bt;
    }

    function isInStock(value) {
      const text = String(value || "").trim().toLowerCase();
      if (!text) return false;
      return !["0", "false", "no", "n", "품절", "없음", "out", "outofstock", "soldout"].includes(text.replace(/\s+/g, ""));
    }

    function updateStats() {
      const rows = state.rows;
      els.productCount.textContent = numberFormatter.format(rows.length);
      els.stockCount.textContent = numberFormatter.format(rows.filter((row) => row.inStock).length);
      els.priceCount.textContent = numberFormatter.format(rows.filter((row) => row.price !== null).length);
      els.discountCount.textContent = numberFormatter.format(rows.filter((row) => row.delta !== null && row.delta < 0).length);
    }

    function applyFilters() {
      const query = els.searchInput.value.trim().toLowerCase();
      const stockFilter = els.stockFilter.value;
      const minPrice = parsePriceInput(els.minPriceInput.value, 0);
      const maxPrice = parsePriceInput(els.maxPriceInput.value, state.defaultMaxPrice);

      state.filtered = state.rows.filter((row) => {
        const matchesQuery = !query || row.name.toLowerCase().includes(query) || row.code.toLowerCase().includes(query);
        const matchesStock = stockFilter === "all" || (stockFilter === "in" ? row.inStock : !row.inStock);
        const matchesMinPrice = minPrice === null || (row.price !== null && row.price >= minPrice);
        const matchesMaxPrice = maxPrice === null || (row.price !== null && row.price <= maxPrice);
        return matchesQuery && matchesStock && matchesMinPrice && matchesMaxPrice;
      });

      state.filtered.sort(getSorter());
      const maxPage = Math.max(1, Math.ceil(state.filtered.length / state.pageSize));
      state.page = Math.min(state.page, maxPage);
      render();
    }

    function getSorter() {
      const byName = (a, b) => a.name.localeCompare(b.name, "ko-KR") || a.code.localeCompare(b.code);
      const direction = state.sortDir === "asc" ? 1 : -1;

      if (state.sortKey === "name") {
        return (a, b) => direction * byName(a, b);
      }
      if (state.sortKey === "stock") {
        return (a, b) => compareValues(a.inStock ? 1 : 0, b.inStock ? 1 : 0, direction) || byName(a, b);
      }
      return (a, b) => compareValues(a[state.sortKey], b[state.sortKey], direction) || byName(a, b);
    }

    function compareValues(a, b, direction) {
      const aMissing = a === null || a === undefined || a === "";
      const bMissing = b === null || b === undefined || b === "";
      if (aMissing && bMissing) return 0;
      if (aMissing) return 1;
      if (bMissing) return -1;
      if (typeof a === "string" || typeof b === "string") {
        return direction * String(a).localeCompare(String(b), "ko-KR");
      }
      return direction * (a - b);
    }

    function parsePriceInput(value, fallback) {
      const text = String(value || "").trim();
      if (!text) return fallback;
      const number = Number(text);
      return Number.isFinite(number) && number >= 0 ? number : fallback;
    }

    function setDefaultPriceRange() {
      els.minPriceInput.value = "0";
      els.maxPriceInput.value = String(state.defaultMaxPrice);
      els.minPriceInput.max = String(state.defaultMaxPrice);
      els.maxPriceInput.max = String(state.defaultMaxPrice);
    }

    function clampPriceInputs() {
      const maxAllowed = state.defaultMaxPrice;
      const minPrice = parsePriceInput(els.minPriceInput.value, 0);
      const maxPrice = parsePriceInput(els.maxPriceInput.value, maxAllowed);
      els.minPriceInput.value = String(Math.min(minPrice, maxAllowed));
      els.maxPriceInput.value = String(Math.min(maxPrice, maxAllowed));
    }

    function render() {
      const start = (state.page - 1) * state.pageSize;
      const pageRows = state.filtered.slice(start, start + state.pageSize);
      els.rows.innerHTML = pageRows.map(renderRow).join("");
      els.empty.hidden = state.filtered.length !== 0;

      const totalPages = Math.max(1, Math.ceil(state.filtered.length / state.pageSize));
      const end = Math.min(start + pageRows.length, state.filtered.length);
      els.pageInfo.textContent = state.filtered.length
        ? numberFormatter.format(start + 1) + "-" + numberFormatter.format(end) + " / " + numberFormatter.format(state.filtered.length) + "개"
        : "0개";
      els.prevButton.disabled = state.page <= 1;
      els.nextButton.disabled = state.page >= totalPages;
      updateSortButtons();
      updateUrlState();
    }

    function setSort(key, dir, shouldUpdateUrl) {
      const previousKey = state.sortKey;
      const previousDir = state.sortDir;
      state.sortKey = key;
      state.sortDir = dir || (previousKey === key ? (previousDir === "asc" ? "desc" : "asc") : defaultSortDir(key));
      syncSortSelect();
      state.page = 1;
      applyFilters();
      if (shouldUpdateUrl !== false) updateUrlState();
    }

    function defaultSortDir(key) {
      return key === "name" ? "asc" : "desc";
    }

    function setSortFromSelect(value, shouldUpdateUrl) {
      const presets = {
        name: ["name", "asc"],
        basePriceDesc: ["basePrice", "desc"],
        basePriceAsc: ["basePrice", "asc"],
        priceDesc: ["price", "desc"],
        priceAsc: ["price", "asc"],
        discountDesc: ["discountRate", "desc"],
        stockDesc: ["stock", "desc"]
      };
      const preset = presets[value] || presets.name;
      state.sortKey = preset[0];
      state.sortDir = preset[1];
      state.page = 1;
      applyFilters();
      if (shouldUpdateUrl !== false) updateUrlState();
    }

    function syncSortSelect() {
      const value = {
        "name:asc": "name",
        "basePrice:desc": "basePriceDesc",
        "basePrice:asc": "basePriceAsc",
        "price:desc": "priceDesc",
        "price:asc": "priceAsc",
        "discountRate:desc": "discountDesc",
        "stock:desc": "stockDesc"
      }[state.sortKey + ":" + state.sortDir];
      if (value) els.sortSelect.value = value;
    }

    function updateSortButtons() {
      els.sortButtons.forEach((button) => {
        const active = button.dataset.sortKey === state.sortKey;
        button.setAttribute("aria-sort", active ? (state.sortDir === "asc" ? "ascending" : "descending") : "none");
      });
    }

    function renderRow(row) {
      const discountClass = row.discountRate === null ? "" : row.discountRate > 0 ? " down" : row.discountRate < 0 ? " up" : "";

      return [
        "<tr>",
        "<td><a class=\"product\" href=\"" + escapeAttribute(productUrl(row.code)) + "\" target=\"_blank\" rel=\"noopener noreferrer\">",
        renderImage(row),
        "<div><div class=\"name\">" + escapeHtml(row.name) + "</div><div class=\"code\">" + escapeHtml(row.code || "-") + "</div></div>",
        "</a></td>",
        "<td class=\"num\">" + money(row.basePrice) + "</td>",
        "<td class=\"num\">" + money(row.price) + "</td>",
        "<td class=\"num delta" + discountClass + "\">" + percent(row.discountRate) + "</td>",
        "<td>" + stockChip(row) + "</td>",
        "<td><button class=\"history-button\" type=\"button\" data-history-code=\"" + escapeAttribute(row.code) + "\">이력</button></td>",
        "</tr>"
      ].join("");
    }

    function openHistory(code, shouldUpdateUrl) {
      const row = state.rows.find((item) => item.code === code);
      if (!row) return;
      const entries = combinedHistory(code);
      els.historyTitle.textContent = row.name;
      els.historySubtitle.textContent = row.code + " · " + entries.length + "개 시점";
      els.historyChart.innerHTML = renderHistoryChart(entries);
      els.historyRows.innerHTML = entries.map(renderHistoryRow).join("");
      els.historyEmpty.hidden = entries.length !== 0;
      els.historyModal.hidden = false;
      state.restoredHistoryCode = code;
      if (shouldUpdateUrl !== false) updateUrlState();
    }

    function closeHistory(shouldUpdateUrl) {
      els.historyModal.hidden = true;
      state.restoredHistoryCode = "";
      if (shouldUpdateUrl !== false) updateUrlState();
    }

    function combinedHistory(code) {
      const byTime = new Map();
      (state.priceHistory.get(code) || []).forEach((item) => {
        const key = String(item.timestamp.getTime());
        if (!byTime.has(key)) byTime.set(key, { timestamp: item.timestamp, price: null, basePrice: null });
        byTime.get(key).price = item.value;
      });
      (state.basePriceHistory.get(code) || []).forEach((item) => {
        const key = String(item.timestamp.getTime());
        if (!byTime.has(key)) byTime.set(key, { timestamp: item.timestamp, price: null, basePrice: null });
        byTime.get(key).basePrice = item.value;
      });
      return [...byTime.values()].sort((a, b) => compareDates(b.timestamp, a.timestamp));
    }

    function renderHistoryRow(entry) {
      const rate = entry.price !== null && entry.basePrice > 0
        ? ((entry.basePrice - entry.price) / entry.basePrice) * 100
        : null;
      const rateClass = rate === null ? "" : rate > 0 ? " down" : rate < 0 ? " up" : "";
      return [
        "<tr>",
        "<td>" + dateText(entry.timestamp) + "</td>",
        "<td class=\"num\">" + money(entry.basePrice) + "</td>",
        "<td class=\"num\">" + money(entry.price) + "</td>",
        "<td class=\"num delta" + rateClass + "\">" + percent(rate) + "</td>",
        "</tr>"
      ].join("");
    }

    function renderHistoryChart(entries) {
      const chartEntries = entries.slice().reverse();
      const points = chartEntries.flatMap((entry) => [entry.price, entry.basePrice]).filter((value) => value !== null);
      if (points.length === 0) return "";

      const width = 860;
      const height = 260;
      const pad = { top: 20, right: 24, bottom: 34, left: 72 };
      const min = Math.min(...points);
      const max = Math.max(...points);
      const span = max - min || 1;
      const xEnd = width - pad.right;
      const firstTime = startOfSeoulDay(chartEntries[0].timestamp).getTime();
      const nowTime = Date.now();
      const lastTime = Math.max(nowTime, chartEntries[chartEntries.length - 1].timestamp.getTime());
      const timeSpan = Math.max(1, lastTime - firstTime);
      const yFor = (value) => pad.top + ((max - value) / span) * (height - pad.top - pad.bottom);
      const xFor = (date) => pad.left + ((date.getTime() - firstTime) / timeSpan) * (xEnd - pad.left);
      const pricePoints = chartEntries.map((entry) => entry.price === null ? null : [xFor(entry.timestamp), yFor(entry.price)]);
      const basePoints = chartEntries.map((entry) => entry.basePrice === null ? null : [xFor(entry.timestamp), yFor(entry.basePrice)]);
      const xLabels = chartDateLabels(chartEntries, xFor, pad.left, xEnd, new Date(firstTime));
      xLabels.push({ text: "지금", x: xEnd, anchor: "end" });
      const midY = yFor((min + max) / 2);

      return [
        "<svg class=\"history-chart\" viewBox=\"0 0 " + width + " " + height + "\" role=\"img\" aria-label=\"가격 이력 그래프\">",
        "<line x1=\"" + pad.left + "\" y1=\"" + pad.top + "\" x2=\"" + pad.left + "\" y2=\"" + (height - pad.bottom) + "\" stroke=\"#cbd5e1\" />",
        "<line x1=\"" + pad.left + "\" y1=\"" + (height - pad.bottom) + "\" x2=\"" + xEnd + "\" y2=\"" + (height - pad.bottom) + "\" stroke=\"#cbd5e1\" />",
        axisLabel(money(max), 8, pad.top + 4),
        axisLabel(money(Math.round((min + max) / 2)), 8, midY + 4),
        axisLabel(money(min), 8, height - pad.bottom + 4),
        "<line x1=\"" + pad.left + "\" y1=\"" + midY + "\" x2=\"" + xEnd + "\" y2=\"" + midY + "\" stroke=\"#e2e8f0\" stroke-dasharray=\"4 5\" />",
        stepPath(basePoints, "#c2410c", xEnd),
        stepPath(pricePoints, "#0f766e", xEnd),
        dots(basePoints, "#c2410c"),
        dots(pricePoints, "#0f766e"),
        xLabels.map((label) => axisLabel(label.text, label.x, height - 10, label.anchor)).join(""),
        "</svg>"
      ].join("");
    }

    function chartDateLabels(entries, xFor, xStart, xEnd, startDate) {
      const minGap = 92;
      const labels = [{ text: shortDate(startDate), x: xStart, anchor: "start" }];
      entries.forEach((entry) => {
        const text = shortDate(entry.timestamp);
        const x = xFor(entry.timestamp);
        const last = labels[labels.length - 1];
        if (!last || (text !== last.text && x - last.x >= minGap && xEnd - x >= minGap)) {
          labels.push({ text, x, anchor: labelAnchor(x, xEnd) });
        }
      });
      const lastText = shortDate(entries[entries.length - 1].timestamp);
      const last = labels[labels.length - 1];
      if (last.text !== lastText && xEnd - last.x >= minGap) {
        const x = xFor(entries[entries.length - 1].timestamp);
        labels.push({ text: lastText, x, anchor: labelAnchor(x, xEnd) });
      }
      return labels;
    }

    function startOfSeoulDay(date) {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Seoul",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(date);
      const values = Object.fromEntries(parts.map((part) => [part.type, part.value]));
      return new Date(Date.UTC(Number(values.year), Number(values.month) - 1, Number(values.day), -9, 0, 0, 0));
    }

    function labelAnchor(x, xEnd) {
      if (x < 112) return "start";
      if (xEnd - x < 112) return "end";
      return "middle";
    }

    function stepPath(points, color, xEnd) {
      const values = points.filter(Boolean);
      if (!values.length) return "";
      const commands = ["M " + values[0][0].toFixed(1) + " " + values[0][1].toFixed(1)];
      for (let i = 1; i < values.length; i += 1) {
        commands.push("H " + values[i][0].toFixed(1));
        commands.push("V " + values[i][1].toFixed(1));
      }
      commands.push("H " + xEnd.toFixed(1));
      return "<path d=\"" + commands.join(" ") + "\" fill=\"none\" stroke=\"" + color + "\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" />";
    }

    function dots(points, color) {
      return points.filter(Boolean).map((point) => (
        "<circle cx=\"" + point[0].toFixed(1) + "\" cy=\"" + point[1].toFixed(1) + "\" r=\"3.5\" fill=\"" + color + "\" />"
      )).join("");
    }

    function axisLabel(text, x, y, anchor) {
      return "<text x=\"" + x + "\" y=\"" + y + "\" text-anchor=\"" + (anchor || "start") + "\" fill=\"#64748b\" font-size=\"12\">" + escapeHtml(text) + "</text>";
    }

    function shortDate(value) {
      return new Intl.DateTimeFormat("ko-KR", {
        timeZone: "Asia/Seoul",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(value);
    }

    function productUrl(code) {
      return "http://costco.co.kr/p/" + encodeURIComponent(code || "");
    }

    function renderImage(row) {
      const src = imageUrl(row.image);
      if (!src) return "<div class=\"thumb missing\">NO IMG</div>";
      return "<img class=\"thumb\" src=\"" + escapeAttribute(src) + "\" alt=\"\" loading=\"lazy\" onerror=\"this.replaceWith(Object.assign(document.createElement('div'),{className:'thumb missing',textContent:'NO IMG'}))\">";
    }

    function imageUrl(value) {
      const src = String(value || "").trim();
      if (!src) return "";
      if (/^https?:\/\//i.test(src)) return src;
      if (src.startsWith("//")) return "https:" + src;
      if (src.startsWith("/")) return "https://www.costco.co.kr" + src;
      return src;
    }

    function stockChip(row) {
      if (!row.stock) return "<span class=\"chip dim\">미확인</span>";
      return row.inStock
        ? "<span class=\"chip\">" + escapeHtml(row.stock) + "</span>"
        : "<span class=\"chip off\">" + escapeHtml(row.stock) + "</span>";
    }

    function money(value) {
      return value === null ? "-" : moneyFormatter.format(value);
    }

    function percent(value) {
      if (value === null) return "-";
      return value.toFixed(1) + "%";
    }

    function dateText(value) {
      return value ? dateFormatter.format(value) : "-";
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/`/g, "&#096;");
    }

    function resetFilters() {
      els.searchInput.value = "";
      els.stockFilter.value = "in";
      setDefaultPriceRange();
      els.sortSelect.value = "discountDesc";
      state.sortKey = "discountRate";
      state.sortDir = "desc";
      els.pageSizeSelect.value = "60";
      state.pageSize = 60;
      state.page = 1;
      closeHistory(false);
      applyFilters();
    }

    function restoreStateFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const stock = params.get("stock");
      const pageSize = Number(params.get("pageSize"));
      const page = Number(params.get("page"));
      const sortKey = params.get("sort");
      const sortDir = params.get("dir");
      const min = params.get("min");
      const max = params.get("max");
      const history = params.get("history");

      els.searchInput.value = params.get("q") || "";
      if (["all", "in", "out"].includes(stock)) els.stockFilter.value = stock;
      if (min !== null) els.minPriceInput.value = String(Math.max(0, Number(min) || 0));
      if (max !== null) {
        const maxValue = Number(max);
        els.maxPriceInput.value = String(Number.isFinite(maxValue) ? Math.min(state.defaultMaxPrice, Math.max(0, maxValue)) : state.defaultMaxPrice);
      }
      clampPriceInputs();
      if ([30, 60, 120].includes(pageSize)) {
        state.pageSize = pageSize;
        els.pageSizeSelect.value = String(pageSize);
      }
      if (["name", "basePrice", "price", "discountRate", "stock"].includes(sortKey)) {
        state.sortKey = sortKey;
        state.sortDir = sortDir === "asc" ? "asc" : "desc";
        syncSortSelect();
      }
      if (Number.isFinite(page) && page > 0) state.page = Math.floor(page);
      state.restoredHistoryCode = history ? cleanCode(history) : "";
    }

    function updateUrlState() {
      if (state.isRestoring) return;
      const params = new URLSearchParams();
      const query = els.searchInput.value.trim();
      const min = parsePriceInput(els.minPriceInput.value, 0);
      const max = parsePriceInput(els.maxPriceInput.value, state.defaultMaxPrice);

      if (query) params.set("q", query);
      if (els.stockFilter.value !== "in") params.set("stock", els.stockFilter.value);
      if (min !== 0) params.set("min", String(min));
      if (max !== state.defaultMaxPrice) params.set("max", String(max));
      if (state.sortKey !== "discountRate" || state.sortDir !== "desc") {
        params.set("sort", state.sortKey);
        params.set("dir", state.sortDir);
      }
      if (state.pageSize !== 60) params.set("pageSize", String(state.pageSize));
      if (state.page !== 1) params.set("page", String(state.page));
      if (!els.historyModal.hidden && state.restoredHistoryCode) params.set("history", state.restoredHistoryCode);

      const queryString = params.toString();
      const nextUrl = window.location.pathname + (queryString ? "?" + queryString : "") + window.location.hash;
      window.history.replaceState(null, "", nextUrl);
    }

    els.searchInput.addEventListener("input", () => {
      state.page = 1;
      applyFilters();
    });
    els.stockFilter.addEventListener("change", () => {
      state.page = 1;
      applyFilters();
    });
    els.minPriceInput.addEventListener("input", () => {
      clampPriceInputs();
      state.page = 1;
      applyFilters();
    });
    els.maxPriceInput.addEventListener("input", () => {
      clampPriceInputs();
      state.page = 1;
      applyFilters();
    });
    els.sortSelect.addEventListener("change", () => {
      setSortFromSelect(els.sortSelect.value);
    });
    els.pageSizeSelect.addEventListener("change", () => {
      state.pageSize = Number(els.pageSizeSelect.value);
      state.page = 1;
      applyFilters();
    });
    els.prevButton.addEventListener("click", () => {
      state.page = Math.max(1, state.page - 1);
      render();
    });
    els.nextButton.addEventListener("click", () => {
      const totalPages = Math.max(1, Math.ceil(state.filtered.length / state.pageSize));
      state.page = Math.min(totalPages, state.page + 1);
      render();
    });
    els.reloadButton.addEventListener("click", loadAll);
    els.resetButton.addEventListener("click", resetFilters);
    els.rows.addEventListener("click", (event) => {
      const button = event.target.closest("[data-history-code]");
      if (button) openHistory(button.dataset.historyCode);
    });
    els.historyCloseButton.addEventListener("click", closeHistory);
    els.historyModal.addEventListener("click", (event) => {
      if (event.target === els.historyModal) closeHistory();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !els.historyModal.hidden) closeHistory();
    });
    els.sortButtons.forEach((button) => {
      button.addEventListener("click", () => setSort(button.dataset.sortKey));
    });

    loadAll();
  </script>
</body>
</html>
