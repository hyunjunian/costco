<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>코스트코 온라인몰 할인 추적기</title>
  <meta name="description" content="코스트코 상품의 할인율, 현재가와 가격 이력을 검색하고 비교합니다.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0f766e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="코스트코 가격">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="코스트코 온라인몰 할인 추적기">
  <meta property="og:description" content="코스트코 상품의 할인율, 현재가와 가격 이력을 검색하고 비교합니다.">
  <meta property="og:site_name" content="코스트코 온라인몰 할인 추적기">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="코스트코 온라인몰 할인 추적기">
  <meta name="twitter:description" content="코스트코 상품의 할인율, 현재가와 가격 이력을 검색하고 비교합니다.">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "코스트코 온라인몰 할인 추적기",
      "applicationCategory": "ShoppingApplication",
      "operatingSystem": "Any",
      "inLanguage": "ko-KR",
      "description": "코스트코 상품의 현재가, 할인율과 가격 이력을 비교하는 웹 애플리케이션입니다."
    }
  </script>
  <script>
    (() => {
      let savedTheme = null;
      try { savedTheme = localStorage.getItem("costco-theme"); } catch (error) {}
      const theme = ["dark", "light"].includes(savedTheme) ? savedTheme : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#111815" : "#ffffff";
    })();
  </script>
  <style>
    :root { color-scheme: light; --bg: #fff; --surface: #fff; --surface-2: #f4f6f5; --text: #202b27; --muted: #748079; --line: #e8ece9; --accent: #0f766e; --ok: #0f766e; --bad: #b33434; --hover: #fafbf9; --active-line: #b4ccc0; --active-bg: #f4f8f5; --backdrop: rgba(20, 35, 29, .35); --popup-shadow: 0 8px 24px rgba(20, 35, 29, .1); }
    html[data-theme="dark"] { color-scheme: dark; --bg: #111815; --surface: #18221d; --surface-2: #212d26; --text: #e8eee9; --muted: #a0afa4; --line: #2b3b31; --accent: #5dd9bc; --ok: #5dd9bc; --bad: #fb9494; --hover: #1b2821; --active-line: #4b8068; --active-bg: #253b32; --backdrop: rgba(0, 0, 0, .65); --popup-shadow: 0 8px 24px rgba(0, 0, 0, .3); }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-width: 320px; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    button, input, select { font: inherit; }
    button { min-height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); color: var(--text); font-size: 12px; cursor: pointer; }
    button:hover { background: var(--surface-2); }
    button:disabled { cursor: not-allowed; opacity: .45; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    input, select { width: 100%; min-height: 40px; padding: 0 11px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); color: var(--text); font-size: 13px; }
    input:focus, select:focus { border-color: var(--accent); }
    input::placeholder { color: var(--muted); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    .shell { width: min(1120px, 100%); margin: 0 auto; padding: 0 24px 32px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 70px; margin-bottom: 18px; }
    h1 { margin: 0; font-size: 17px; font-weight: 750; letter-spacing: -.035em; }
    .title-button { padding: 0; border: 0; background: none; font: inherit; letter-spacing: inherit; }
    .title-button:hover { background: none; }
    .refresh-button { min-height: 40px; width: 40px; border: 0; font-size: 23px; color: var(--muted); }
    .refresh-group { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .theme-toggle { display: inline-flex; align-items: center; justify-content: center; min-height: 36px; width: 36px; padding: 0; border: 0; background: none; color: var(--muted); }
    .theme-toggle svg { width: 19px; height: 19px; }
    .theme-icon-sun { display: none; }
    html[data-theme="dark"] .theme-icon-moon { display: none; }
    html[data-theme="dark"] .theme-icon-sun { display: block; }
    #meta { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .online-events { margin-bottom: 26px; }
    .event-status { display: flex; align-items: center; gap: 10px; }
    #onlineEventsStatus { margin: 0; font-size: 12px; color: var(--muted); }
    #onlineEventsStatus[data-error] { color: var(--bad); }
    #onlineEventsStatus a { color: var(--accent); }
    .online-events-content { display: grid; gap: 16px; min-width: 0; }
    .online-event-group { min-width: 0; }
    .online-event-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; min-width: 0; }
    .online-event-card { display: block; min-width: 0; color: inherit; text-decoration: none; overflow-wrap: anywhere; }
    .online-event-card img { display: block; width: 100%; height: auto; border-radius: 5px; }
    .online-event-body { padding: 9px 0 0; min-width: 0; }
    .online-event-title { display: block; font-size: 13px; font-weight: 650; line-height: 1.5; }
    .online-event-card:hover .online-event-title { color: var(--accent); }
    .online-event-date { display: block; margin-top: 5px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .toolbar { position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: minmax(200px, 1fr) auto; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); background: var(--bg); }
    .search-control { position: relative; min-width: 0; }
    .search-icon { position: absolute; left: 12px; top: 12px; width: 17px; height: 17px; pointer-events: none; color: var(--muted); }
    #searchInput { padding-left: 37px; padding-right: 38px; }
    #searchInput::-webkit-search-cancel-button { -webkit-appearance: none; }
    #searchClearButton { position: absolute; right: 3px; top: 3px; min-height: 34px; width: 34px; padding: 0; border: 0; background: none; color: var(--muted); font-size: 21px; }
    #filterToggleButton { display: none; }
    .filter-controls { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .price-range { width: 238px; margin: 0; padding: 0; border: 0; min-width: 0; flex-shrink: 0; }
    .price-inputs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 7px; }
    .price-input { position: relative; }
    .price-input input { padding-right: 27px; font-variant-numeric: tabular-nums; }
    .price-input span { position: absolute; right: 10px; top: 11px; color: var(--muted); font-size: 12px; pointer-events: none; }
    .range-divider { color: var(--muted); }
    .check-group { display: flex; gap: 12px; }
    .check-filter { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; min-height: 36px; white-space: nowrap; }
    .check-filter:has(input:checked) { color: var(--text); }
    .check-filter input { width: 14px; min-height: 14px; height: 14px; margin: 0; padding: 0; accent-color: var(--accent); }
    #resetButton { border: 0; color: var(--muted); padding: 0 4px; background: none; white-space: nowrap; }
    #resetButton:hover { color: var(--accent); }
    .results-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0 10px; font-size: 12px; color: var(--muted); }
    .status { display: flex; align-items: center; gap: 8px; padding: 10px 0 16px; font-size: 12px; color: var(--muted); }
    .status.error { color: var(--bad); }
    .spinner { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    table { width: 100%; border-collapse: collapse; }
    .table-wrap > table > thead { position: sticky; top: var(--toolbar-height, 65px); z-index: 5; background: var(--bg); }
    .table-wrap > table > thead th { background: var(--bg); }
    th, td { padding: 17px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
    th { font-size: 11px; font-weight: 500; color: var(--muted); padding-top: 10px; padding-bottom: 10px; }
    th:first-child, td:first-child { padding-left: 0; }
    th:last-child, td:last-child { padding-right: 0; }
    tbody tr:hover { background: var(--hover); }
    .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .sort-button { display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; border: 0; background: none; font: inherit; color: inherit; padding: 0; min-height: 24px; }
    .sort-button:hover { background: none; color: var(--accent); }
    .sort-button::after { content: "↕"; color: var(--muted); }
    th[aria-sort="ascending"] .sort-button::after { content: "↑"; color: var(--accent); }
    th[aria-sort="descending"] .sort-button::after { content: "↓"; color: var(--accent); }
    .product { display: grid; grid-template-columns: 84px minmax(0, 1fr); align-items: center; gap: 15px; max-width: 510px; color: inherit; text-decoration: none; }
    .product:hover .name { color: var(--accent); }
    .thumb { width: 84px; height: 84px; object-fit: contain; background: #fff; border-radius: 4px; }
    .thumb.missing { display: grid; place-items: center; background: var(--surface-2); color: var(--muted); font-size: 9px; }
    .name { font-size: 14px; line-height: 1.5; font-weight: 500; overflow-wrap: anywhere; }
    .current-price { font-size: 17px; font-weight: 650; letter-spacing: -.025em; }
    .price-history-button { display: inline-flex; flex-direction: column; align-items: flex-end; gap: 4px; padding: 0; border: 0; background: none; color: inherit; min-height: 44px; }
    .price-history-button:hover { background: none; color: var(--accent); }
    .price-sparkline { display: block; width: 100px; height: 24px; }
    .history-link { display: block; font-size: 10px; color: var(--muted); }
    .discount-value { font-size: 15px; font-weight: 600; color: var(--accent); }
    .delta.up .discount-value { color: var(--bad); }
    .price-age { font-size: 12px; color: var(--muted); }
    .modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px; background: var(--backdrop); }
    .dialog { display: grid; grid-template-rows: auto minmax(0, 1fr); width: min(800px, 100%); max-height: calc(100dvh - 40px); overflow: hidden; border-radius: 10px; background: var(--surface); }
    .dialog-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 21px 22px; border-bottom: 1px solid var(--line); }
    .dialog-title { margin: 0; font-size: 16px; font-weight: 650; line-height: 1.5; }
    .dialog-subtitle { margin-top: 5px; font-size: 12px; color: var(--muted); }
    .dialog-body { overflow: auto; padding: 20px 22px; }
    .history-controls { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
    #historyRangeSelect { width: 100px; min-height: 36px; font-size: 12px; }
    #historyPointSummary { min-width: 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .history-chart { display: block; width: 100%; height: auto; touch-action: pan-y; }
    .history-table { margin-top: 20px; font-size: 12px; }
    .history-table th, .history-table td { padding: 12px 8px; }
    .history-table th:first-child, .history-table td:first-child { padding-left: 0; }
    .history-table th:last-child, .history-table td:last-child { padding-right: 0; }
    #historyNote, #historyEmpty { font-size: 12px; color: var(--muted); }
    .empty { text-align: center; padding: 38px 0; font-size: 13px; color: var(--muted); }
    .empty p { margin: 0 0 15px; }
    #loadMoreButton { display: block; width: min(240px, 100%); margin: 20px auto 0; }
    @media (max-width: 900px) {
      .online-event-grid { display: flex; gap: 14px; overflow-x: auto; padding: 2px 2px 8px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
      .online-event-card { flex: 0 0 240px; scroll-snap-align: start; }
      .toolbar { grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
      #filterToggleButton { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 14px; }
      #filterToggleButton[aria-expanded="true"] { color: var(--accent); border-color: var(--active-line); background: var(--active-bg); }
      .filter-controls { display: none; position: absolute; top: calc(100% + 8px); right: 0; width: min(360px, 100%); padding: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: var(--popup-shadow); gap: 13px; }
      .toolbar:has(#filterToggleButton[aria-expanded="true"]) > .filter-controls { display: grid; }
      .filter-controls .price-range { width: 100%; }
      .filter-controls .check-group { flex-wrap: wrap; gap: 10px 16px; }
      .filter-controls #resetButton { justify-self: end; min-height: 36px; }
      .table-wrap > table, .table-wrap > table > tbody, .table-wrap > table > tbody > tr, .table-wrap > table > tbody > tr > td { display: block; }
      .table-wrap > table > thead { display: block; border-bottom: 1px solid var(--line); }
      .table-wrap > table > thead > tr { display: grid; grid-template-columns: .6fr minmax(100px, 1fr) 1.2fr; gap: 10px; }
      .table-wrap > table > thead th { padding: 7px 0; border: 0; }
      .table-wrap > table > thead th:first-child { display: none; }
      .table-wrap > table > thead th:nth-child(2) { text-align: left; }
      .table-wrap > table > thead th:nth-child(3) { text-align: center; }
      #rows { display: grid; grid-template-columns: 1fr; }
      #rows > tr { display: grid; grid-template-columns: .6fr minmax(100px, 1fr) 1.2fr; gap: 13px 10px; padding: 18px 0; border-bottom: 1px solid var(--line); }
      #rows > tr > td { padding: 0; border: 0; }
      #rows > tr > td:first-child { grid-column: 1 / -1; }
      #rows .product { grid-template-columns: 88px minmax(0, 1fr); gap: 14px; }
      #rows .thumb { width: 88px; height: 88px; }
      #rows td[data-label="현재가"] { text-align: center; }
      #rows td[data-label="할인율"] { text-align: left; }
      #rows td[data-label="갱신일시"] { text-align: right; align-self: start; padding-top: 3px; }
      .price-history-button { align-items: center; }
      .current-price { font-size: 17px; }
      .price-age { font-size: 11px; }
    }
    @media (max-width: 640px) {
      .shell { padding: 0 16px 26px; }
      .topbar { min-height: 58px; margin-bottom: 12px; gap: 8px; }
      .theme-toggle { width: 32px; }
      h1 { font-size: 16px; }
      #meta { font-size: 10px; }
      .online-events { margin-bottom: 20px; }
      .online-event-card { flex-basis: 230px; }
      .online-event-title { font-size: 12px; }
      .results-bar { padding-top: 12px; }
      #rows { grid-template-columns: 1fr; }
      #rows > tr { padding: 16px 0; gap: 12px 10px; }
      .current-price { font-size: 19px; }
      .discount-value { font-size: 16px; }
      .price-age { font-size: 12px; }
      .event-status { flex-wrap: wrap; }
      .modal { padding: 0; align-items: end; }
      .dialog { max-height: 90dvh; border-radius: 10px 10px 0 0; }
      .dialog-head { padding: 18px 16px; }
      .dialog-body { padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
      .history-controls { align-items: flex-start; }
      .history-table { font-size: 11px; }
      .history-table th, .history-table td { padding: 11px 5px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <h1><button id="titleResetButton" class="title-button" type="button" title="기본 검색 조건으로 돌아가기">코스트코 할인</button></h1>
      <div class="refresh-group">
        <span id="meta" role="status">불러오는 중</span>
        <button id="productsRefreshButton" class="refresh-button" type="button" aria-label="가격과 이벤트 새로고침" title="새로고침">↻</button>
        <button id="themeToggleButton" class="theme-toggle" type="button" aria-label="다크 모드로 전환" title="다크 모드로 전환">
          <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13.2A8.5 8.5 0 0 1 10.8 3.5a8.5 8.5 0 1 0 9.7 9.7Z"/></svg>
          <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <section class="online-events" id="eventsSection" aria-label="현재 이벤트">
      <div class="event-status"><p id="onlineEventsStatus" role="status" aria-live="polite">이벤트를 불러오는 중입니다.</p><button id="onlineEventsRefresh" type="button" hidden>다시 시도</button></div>
      <div id="onlineEventsContent" class="online-events-content" aria-busy="true"></div>
    </section>

    <section id="productsSection" aria-label="상품 검색과 가격">
      <section class="toolbar" id="productToolbar" aria-label="상품 검색과 필터">
        <div class="search-control">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <input id="searchInput" type="search" aria-label="상품명 또는 상품 코드 검색" placeholder="상품명 또는 코드 검색" autocomplete="off">
          <button id="searchClearButton" type="button" aria-label="검색어 지우기" hidden>×</button>
        </div>
        <button id="filterToggleButton" type="button" aria-expanded="false" aria-controls="filterControls">필터</button>
        <div class="filter-controls" id="filterControls" role="group" aria-label="상품 필터">
          <fieldset class="price-range">
            <legend class="sr-only">가격 범위</legend>
            <div class="price-inputs">
              <div class="price-input"><input id="minPriceInput" aria-label="최소 가격" type="number" min="0" step="100" inputmode="numeric" value="0"><span>원</span></div>
              <span class="range-divider" aria-hidden="true">–</span>
              <div class="price-input"><input id="maxPriceInput" aria-label="최대 가격" type="number" min="0" step="100" inputmode="numeric"><span>원</span></div>
            </div>
          </fieldset>
          <div class="check-group" role="group" aria-label="상품 상태 필터">
            <label class="check-filter"><input id="inStockOnlyInput" type="checkbox" checked> 판매 상품만</label>
            <label class="check-filter"><input id="discountOnlyInput" type="checkbox" checked> 할인 상품만</label>
          </div>
          <button id="resetButton" type="button">초기화</button>
        </div>
      </section>

      <div class="results-bar">
        <span id="resultCount" role="status" aria-live="polite"></span>
      </div>
      <div class="status" id="status" role="status" hidden></div>
      <div class="table-wrap">
        <table aria-label="상품의 현재가, 할인율과 마지막 가격 업데이트">
          <thead><tr><th scope="col">상품</th><th scope="col" class="num"><button class="sort-button" type="button" data-sort-key="discountRate">할인율</button></th><th scope="col" class="num"><button class="sort-button" type="button" data-sort-key="price">현재가</button></th><th scope="col" class="num"><button class="sort-button" type="button" data-sort-key="priceTimestamp">갱신일시</button></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty" hidden><p>조건에 맞는 상품이 없습니다.</p><button id="clearFiltersButton" type="button">모든 상품 보기</button></div>
      </div>
      <button id="loadMoreButton" type="button" hidden>더 보기</button>
    </section>
  </main>

  <div class="modal" id="historyModal" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
      <header class="dialog-head"><div><h2 class="dialog-title" id="historyTitle"></h2><div class="dialog-subtitle">가격 이력</div></div><button id="historyCloseButton" type="button">닫기</button></header>
      <div class="dialog-body" tabindex="0" aria-label="가격 이력 상세">
        <div class="history-controls"><span id="historyPointSummary" role="status" aria-live="polite"></span><select id="historyRangeSelect" aria-label="가격 이력 기간"><option value="all">전체</option><option value="90">90일</option><option value="30">30일</option></select></div>
        <div id="historyChart"></div>
        <p id="historyNote" hidden></p>
        <p id="historyEmpty" hidden>이 기간에 확인된 가격 이력이 없습니다.</p>
        <table class="history-table" aria-label="날짜별 가격 이력"><thead><tr><th scope="col">일시</th><th scope="col" class="num">가격</th><th scope="col" class="num">할인율</th></tr></thead><tbody id="historyRows"></tbody></table>
      </div>
    </section>

  <script>
    "use strict";

    (() => {
      const COSTCO_ORIGIN = "https://www.costco.co.kr";
      const EVENTS_URL = `${COSTCO_ORIGIN}/rest/v3/korea/cms/pages?pageType=ContentPage&pageLabelOrId=OnlineEvent&lang=ko&curr=KRW`;
      const content = document.getElementById("onlineEventsContent");
      const status = document.getElementById("onlineEventsStatus");
      const refresh = document.getElementById("onlineEventsRefresh");
      const section = document.getElementById("eventsSection");

      function safeUrl(value, image = false) {
        if (typeof value !== "string" || !value.trim()) return null;
        try {
          const url = new URL(value, COSTCO_ORIGIN);
          const costco = url.hostname === "costco.co.kr" || url.hostname.endsWith(".costco.co.kr");
          const imageCdn = image && url.hostname === "azure-na-images.contentstack.com";
          return url.protocol === "https:" && (costco || imageCdn) &&
            !url.username && !url.password ? url.href : null;
        } catch {
          return null;
        }
      }

      function appendText(parent, tag, className, text) {
        if (!text) return;
        const element = document.createElement(tag);
        element.className = className;
        element.textContent = text;
        parent.append(element);
      }

      function createCard(anchor, seen) {
        if (anchor.closest('[hidden], [aria-hidden="true"]')) return null;
        const sourceImage = anchor.querySelector("img");
        const href = safeUrl(anchor.getAttribute("href"));
        const src = safeUrl(sourceImage?.getAttribute("src") || sourceImage?.getAttribute("data-src"), true);
        if (!href || !src || seen.has(href)) return null;
        seen.add(href);
        const text = (selector) => anchor.querySelector(selector)?.textContent.trim() || "";
        const title = text(".title") || anchor.parentElement.querySelector(".weekly-title-final")?.textContent.trim() ||
          sourceImage.getAttribute("alt") || "코스트코 온라인 이벤트";
        const card = document.createElement("a");
        card.className = "online-event-card";
        card.href = href;
        card.target = "_blank";
        card.rel = "noopener noreferrer";
        const image = document.createElement("img");
        image.src = src;
        image.alt = sourceImage.getAttribute("alt") || title;
        image.loading = "lazy";
        image.decoding = "async";
        card.append(image);
        const body = document.createElement("div");
        body.className = "online-event-body";
        appendText(body, "strong", "online-event-title", title);
        appendText(body, "span", "online-event-date", text(".date"));
        card.append(body);
        return card;
      }

      function renderEvents(page) {
        if (!Array.isArray(page?.page_composer)) throw new Error("Unexpected event page response");
        const fragment = document.createDocumentFragment();
        const seen = new Set();
        // Read only page content, excluding the response's shared header/footer.
        for (const entry of page.page_composer) {
          for (const component of entry.row?.row_composer || []) {
            const references = component.html_render_component_block?.html_render_component_ref || [];
            for (const reference of references) {
              if (typeof reference.html !== "string") continue;
              const parsed = new DOMParser().parseFromString(reference.html, "text/html");
              // Keep section headings, but rebuild each card without remote CSS/JS.
              parsed.querySelectorAll("script, style, template, noscript, iframe, object, embed").forEach((node) => node.remove());
              const sections = parsed.querySelectorAll("section");
              const groups = sections.length ? sections : [parsed.body];
              for (const source of groups) {
                const heading = source.querySelector("h2, h3")?.textContent.trim() || "";
                if (source.id === "paid-ads" || /이번주추천상품/.test(heading.replace(/\s/g, ""))) continue;
              const group = document.createElement("div");
                group.className = "online-event-group";
                const grid = document.createElement("div");
                grid.className = "online-event-grid";
            grid.tabIndex = 0;
            grid.setAttribute("aria-label", "현재 이벤트 목록, 옆으로 스크롤할 수 있습니다");
                for (const anchor of source.querySelectorAll("a[href]")) {
                  const card = createCard(anchor, seen);
                  if (card) grid.append(card);
                }
                if (!grid.childElementCount) continue;
                group.append(grid);
                fragment.append(group);
              }
            }
          }
        }
        content.replaceChildren(fragment);
        return seen.size;
      }

      async function loadEvents() {
        if (refresh.disabled) return;
        refresh.disabled = true;
        refresh.hidden = true;
        section.hidden = false;
        status.hidden = false;
        content.setAttribute("aria-busy", "true");
        content.replaceChildren();
        status.textContent = "이벤트를 불러오는 중입니다.";
      status.removeAttribute("data-error");
        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), 15000);
        try {
          const response = await fetch(EVENTS_URL, {
            mode: "cors",
            credentials: "omit",
            cache: "no-store",
            signal: controller.signal
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const count = renderEvents(await response.json());
          status.textContent = "";
          status.hidden = true;
          section.hidden = !count;
        } catch (error) {
          content.replaceChildren();
          refresh.hidden = false;
        status.setAttribute("data-error", "true");
          status.textContent = error.name === "AbortError"
          ? "이벤트 확인이 지연되고 있어요. 잠시 후 다시 시도해 주세요. "
          : "이벤트를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요. ";
        const link = document.createElement("a");
        link.href = COSTCO_ORIGIN + "/OnlineEvent";
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "공식 이벤트 확인 ↗";
        status.append(link);
        } finally {
          window.clearTimeout(timeout);
          content.setAttribute("aria-busy", "false");
          refresh.disabled = false;
        }
      }

      refresh.addEventListener("click", loadEvents);
      document.getElementById("productsRefreshButton").addEventListener("click", loadEvents);
      loadEvents();
    })();
  </script>
  <script>
    "use strict";

    const SOURCES = {
      products: {
        csv: "https://docs.google.com/spreadsheets/d/1JhhzwsnZoQjzd1xksaqnNjuk2oVc5tjrCPbxNcWAUsk/gviz/tq?tqx=out:csv&sheet=products",
        columns: ["code", "name", "image", "stock"]
      },
      prices: {
        csv: "https://docs.google.com/spreadsheets/d/1JhhzwsnZoQjzd1xksaqnNjuk2oVc5tjrCPbxNcWAUsk/gviz/tq?tqx=out:csv&sheet=prices",
        columns: ["code", "price", "timestamp"]
      },
      basePrices: {
        csv: "https://docs.google.com/spreadsheets/d/1JhhzwsnZoQjzd1xksaqnNjuk2oVc5tjrCPbxNcWAUsk/gviz/tq?tqx=out:csv&sheet=basePrices",
        columns: ["code", "basePrice", "timestamp"]
      }
    };

    const STORAGE_KEYS = {
      alertCodes: "costco-alert-codes-v1",
      priceSnapshot: "costco-price-snapshot-v1"
    };
    const DB_NAME = "costco-price-alerts";
    const DB_VERSION = 1;
    const DB_STORE = "kv";
    const PRICE_CHECK_INTERVAL_MS = 60 * 60 * 1000;

    const state = {
      products: [],
      rows: [],
      filtered: [],
      priceHistory: new Map(),
      basePriceHistory: new Map(),
      serviceWorkerRegistration: null,
      visibleCount: 20,
      sortKey: "",
      sortDir: "",
      defaultMaxPrice: 0,
      isRestoring: true,
      loadedAt: null,
      loading: false,
      historyCode: "",
      historyReturnFocus: null,
      previousBodyOverflow: ""
    };

    const LOAD_BATCH_SIZE = 20;
    const SEARCH_DEBOUNCE_MS = 120;
    let searchFilterTimer = 0;
    let dbPromise = null;

    const els = {
      meta: document.getElementById("meta"),
      status: document.getElementById("status"),
      rows: document.getElementById("rows"),
      empty: document.getElementById("empty"),
      searchInput: document.getElementById("searchInput"),
      minPriceInput: document.getElementById("minPriceInput"),
      maxPriceInput: document.getElementById("maxPriceInput"),
      inStockOnlyInput: document.getElementById("inStockOnlyInput"),
      discountOnlyInput: document.getElementById("discountOnlyInput"),
      resetButton: document.getElementById("resetButton"),
      titleResetButton: document.getElementById("titleResetButton"),
      sortButtons: document.querySelectorAll("[data-sort-key]")
    };
    Object.assign(els, {
      resultCount: document.getElementById("resultCount"),
      searchClearButton: document.getElementById("searchClearButton"),
      clearFiltersButton: document.getElementById("clearFiltersButton"),
      productsRefreshButton: document.getElementById("productsRefreshButton"),
      loadMoreButton: document.getElementById("loadMoreButton"),
      productToolbar: document.getElementById("productToolbar"),
      filterToggleButton: document.getElementById("filterToggleButton"),
      filterControls: document.getElementById("filterControls"),
      historyModal: document.getElementById("historyModal"),
      historyTitle: document.getElementById("historyTitle"),
      historyCloseButton: document.getElementById("historyCloseButton"),
      historyRangeSelect: document.getElementById("historyRangeSelect"),
      historyPointSummary: document.getElementById("historyPointSummary"),
      historyChart: document.getElementById("historyChart"),
      historyRows: document.getElementById("historyRows"),
      historyNote: document.getElementById("historyNote"),
      historyEmpty: document.getElementById("historyEmpty")
    });

    const compactFilters = window.matchMedia("(max-width: 900px)");
    const systemTheme = window.matchMedia("(prefers-color-scheme: dark)");
    let preferredTheme = null;
    try { preferredTheme = localStorage.getItem("costco-theme"); } catch (error) {}

    function applyTheme(theme, save = false) {
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#111815" : "#ffffff";
      const button = document.getElementById("themeToggleButton");
      const label = theme === "dark" ? "라이트 모드로 전환" : "다크 모드로 전환";
      button.setAttribute("aria-label", label);
      button.title = label;
      if (save) {
        preferredTheme = theme;
        try { localStorage.setItem("costco-theme", theme); } catch (error) {}
      }
    }

    const moneyFormatter = new Intl.NumberFormat("ko-KR", {
      style: "currency",
      currency: "KRW",
      maximumFractionDigits: 0
    });

    const numberFormatter = new Intl.NumberFormat("ko-KR");
    const dateFormatter = new Intl.DateTimeFormat("ko-KR", {
      timeZone: "Asia/Seoul",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    });

    function setStatus(message, isError) {
      els.status.hidden = false;
      els.status.className = isError ? "status error" : "status";
      els.status.innerHTML = isError
        ? "<span>" + escapeHtml(message) + "</span>"
        : "<span class=\"spinner\"></span><span>" + escapeHtml(message) + "</span>";
    }

    function setReadyStatus() {
      els.status.hidden = true;
      els.status.className = "status";
      els.status.innerHTML = "";
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let value = "";
      let quoted = false;

      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        const next = text[i + 1];

        if (quoted) {
          if (char === "\"" && next === "\"") {
            value += "\"";
            i += 1;
          } else if (char === "\"") {
            quoted = false;
          } else {
            value += char;
          }
        } else if (char === "\"") {
          quoted = true;
        } else if (char === ",") {
          row.push(value);
          value = "";
        } else if (char === "\n") {
          row.push(value);
          rows.push(row);
          row = [];
          value = "";
        } else if (char !== "\r") {
          value += char;
        }
      }

      if (value.length || row.length) {
        row.push(value);
        rows.push(row);
      }

      return rows.filter((item) => item.some((cell) => cell.trim() !== ""));
    }

    function rowsToObjects(rows, fallbackColumns) {
      if (!rows.length) return [];
      const first = rows[0].map((header) => String(header || "").trim().replace(/\s+/g, "").toLowerCase());
      const hasHeader = fallbackColumns.every((column) => first.includes(column.toLowerCase()));
      const headers = hasHeader
        ? rows[0].map((header) => String(header || "").trim())
        : fallbackColumns;
      const dataRows = hasHeader ? rows.slice(1) : rows;

      return dataRows.map((row) => {
        const item = {};
        headers.forEach((header, index) => {
          item[header] = (row[index] || "").trim();
        });
        return item;
      });
    }

    async function loadCsvSource(key) {
      const source = SOURCES[key];
      const response = await fetch(source.csv, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(key + " CSV 응답 오류: " + response.status);
      }
      const text = await response.text();
      return rowsToObjects(parseCsv(text), source.columns);
    }

    async function loadAll() {
      if (state.loading) return;
      state.loading = true;
      els.productsRefreshButton.disabled = true;
      setStatus("상품 가격을 확인하고 있습니다.", false);

      try {
        const [products, prices, basePrices] = await Promise.all([
          loadCsvSource("products"),
          loadCsvSource("prices"),
          loadCsvSource("basePrices")
        ]);
        await applyLoadedData(products, prices, basePrices);
      } catch (error) {
        setStatus("상품 가격을 불러오지 못했습니다. 새로고침을 눌러 다시 시도해 주세요.", true);
        if (!state.loadedAt) {
          els.meta.textContent = "갱신 실패";
          els.resultCount.textContent = "가격 확인이 필요합니다.";
        }
        console.error(error);
      } finally {
        state.loading = false;
        els.productsRefreshButton.disabled = false;
      }
    }

    async function applyLoadedData(products, prices, basePrices) {
      const latestPrices = latestByCode(prices, "price");
      const latestBasePrices = latestByCode(basePrices, "basePrice");
      state.priceHistory = historyByCode(prices, "price");
      state.basePriceHistory = historyByCode(basePrices, "basePrice");

      state.products = products;
      state.rows = products.map((product) => {
        const code = cleanCode(product.code);
        const price = latestPrices.get(code);
        const basePrice = latestBasePrices.get(code);
        const currentPrice = price ? toNumber(price.price) : null;
        const currentBasePrice = basePrice ? toNumber(basePrice.basePrice) : null;

        return {
          code,
          name: product.name || "(이름 없음)",
          searchText: ((product.name || "") + " " + code).toLowerCase(),
          image: product.image || "",
          stock: product.stock || "",
          inStock: isInStock(product.stock),
          price: currentPrice,
          priceTimestamp: price ? parseDate(price.timestamp) : null,
          basePrice: currentBasePrice,
          basePriceTimestamp: basePrice ? parseDate(basePrice.timestamp) : null,
          delta: currentPrice !== null && currentBasePrice !== null ? currentPrice - currentBasePrice : null,
          priceSeries: preparePriceHistory(state.priceHistory.get(code) || []),
          discountRate: currentPrice !== null && currentBasePrice > 0
            ? ((currentBasePrice - currentPrice) / currentBasePrice) * 100
            : null
        };
      });

      state.loadedAt = new Date();
      state.defaultMaxPrice = Math.max(0, ...state.rows.map((row) => row.price || 0));
      await notifyPriceChanges(await detectPriceChanges(state.rows));
      await savePriceSnapshot(state.rows);
      setDefaultPriceRange();
      restoreStateFromUrl();
      await applyFilters();
      state.isRestoring = false;
      const historyCode = new URLSearchParams(window.location.search).get("history");
      if (historyCode) openHistory(historyCode);
      updateUrlState();
      setReadyStatus();
      els.meta.textContent = new Intl.DateTimeFormat("ko-KR", {
        timeZone: "Asia/Seoul", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false
      }).format(state.loadedAt) + " 갱신";
      els.meta.title = dateFormatter.format(state.loadedAt) + " (한국 시간)";
    }

    function latestByCode(rows, valueKey) {
      const map = new Map();
      rows.forEach((row) => {
        const code = cleanCode(row.code);
        if (!code || toNumber(row[valueKey]) === null) return;
        const current = map.get(code);
        const nextDate = parseDate(row.timestamp);
        const currentDate = current ? parseDate(current.timestamp) : null;
        if (!current || compareDates(nextDate, currentDate) >= 0) {
          map.set(code, row);
        }
      });
      return map;
    }

    function historyByCode(rows, valueKey) {
      const map = new Map();
      rows.forEach((row) => {
        const code = cleanCode(row.code);
        const value = toNumber(row[valueKey]);
        const timestamp = parseDate(row.timestamp);
        if (!code) return;
        if (!map.has(code)) map.set(code, []);
        map.get(code).push({ value, timestamp });
      });
      map.forEach((items) => {
        items.sort((a, b) => compareDates(b.timestamp, a.timestamp));
      });
      return map;
    }

    function cleanCode(value) {
      return String(value || "").trim();
    }

    function toNumber(value) {
      const cleaned = String(value || "").replace(/[^\d.-]/g, "");
      if (!cleaned) return null;
      const number = Number(cleaned);
      return Number.isFinite(number) ? number : null;
    }

    function parseDate(value) {
      if (!value) return null;
      if (value instanceof Date) return value;
      const numeric = Number(String(value).trim());
      if (Number.isFinite(numeric)) {
        const milliseconds = numeric > 100000000000 ? numeric : numeric * 1000;
        const numericDate = new Date(milliseconds);
        if (!Number.isNaN(numericDate.getTime())) return numericDate;
      }
      const date = new Date(value);
      if (!Number.isNaN(date.getTime())) return date;

      const normalized = String(value).replace(/\./g, "-").replace(/\s+/g, " ").trim();
      const fallback = new Date(normalized);
      return Number.isNaN(fallback.getTime()) ? null : fallback;
    }

    function compareDates(a, b) {
      const at = a ? a.getTime() : 0;
      const bt = b ? b.getTime() : 0;
      return at - bt;
    }

    function isInStock(value) {
      const text = String(value || "").trim().toLowerCase();
      if (!text) return false;
      return !["0", "false", "no", "n", "품절", "없음", "out", "outofstock", "soldout"].includes(text.replace(/\s+/g, ""));
    }

    async function applyFilters() {
      state.filtered = baseFilteredRows();

      const sorter = getSorter();
      if (sorter) state.filtered.sort(sorter);
      state.visibleCount = Math.min(Math.max(state.visibleCount, LOAD_BATCH_SIZE), state.filtered.length || LOAD_BATCH_SIZE);
      await render();
    }

    function resetProductStatusFilterAvailability() {
      els.inStockOnlyInput.disabled = false;
      els.discountOnlyInput.disabled = false;
    }

    function baseFilteredRows() {
      const query = els.searchInput.value.trim().toLowerCase();
      const minPrice = parsePriceInput(els.minPriceInput.value, 0);
      const maxPrice = parsePriceInput(els.maxPriceInput.value, state.defaultMaxPrice);

      return state.rows.filter((row) => {
        const matchesQuery = !query || row.searchText.includes(query);
        const matchesMinPrice = minPrice === null || (row.price !== null && row.price >= minPrice);
        const matchesMaxPrice = maxPrice === null || (row.price !== null && row.price <= maxPrice);
        const matchesStock = !els.inStockOnlyInput.checked || row.inStock;
        const matchesDiscount = !els.discountOnlyInput.checked || (row.inStock && row.delta !== null && row.delta < 0);
        return matchesQuery && matchesMinPrice && matchesMaxPrice && matchesStock && matchesDiscount;
      });
    }

    function getSorter() {
      if (state.sortKey === "priceTimestamp") {
        const direction = state.sortDir === "asc" ? 1 : -1;
        return (a, b) => compareValues(a.priceTimestamp?.getTime(), b.priceTimestamp?.getTime(), direction);
      }
      if (state.sortKey === "price") {
        const direction = state.sortDir === "asc" ? 1 : -1;
        return (a, b) => compareValues(a.price, b.price, direction);
      }
      if (state.sortKey === "discountRate") {
        const direction = state.sortDir === "asc" ? 1 : -1;
        return (a, b) => compareValues(a.discountRate, b.discountRate, direction);
      }
      return compareRowsByLatestPrice;
    }

    function compareRowsByLatestPrice(a, b) {
      return compareValues(a.priceTimestamp?.getTime(), b.priceTimestamp?.getTime(), -1);
    }

    function compareValues(a, b, direction) {
      const aMissing = a === null || a === undefined || a === "";
      const bMissing = b === null || b === undefined || b === "";
      if (aMissing && bMissing) return 0;
      if (aMissing) return 1;
      if (bMissing) return -1;
      return direction * (a - b);
    }

    function parsePriceInput(value, fallback) {
      const text = String(value || "").trim();
      if (!text) return fallback;
      const number = Number(text);
      return Number.isFinite(number) && number >= 0 ? number : fallback;
    }

    function setDefaultPriceRange() {
      els.minPriceInput.value = "0";
      els.maxPriceInput.value = String(state.defaultMaxPrice);
      els.minPriceInput.max = String(state.defaultMaxPrice);
      els.maxPriceInput.max = String(state.defaultMaxPrice);
    }

    function clampPriceInputs() {
      const maxAllowed = state.defaultMaxPrice;
      const minPrice = parsePriceInput(els.minPriceInput.value, 0);
      const maxPrice = parsePriceInput(els.maxPriceInput.value, maxAllowed);
      els.minPriceInput.value = String(Math.min(minPrice, maxAllowed));
      els.maxPriceInput.value = String(Math.min(maxPrice, maxAllowed));
    }

    async function render() {
      const pageRows = state.filtered.slice(0, state.visibleCount);
      els.rows.innerHTML = pageRows.map(renderRow).join("");
      els.empty.hidden = state.filtered.length !== 0;
      updateResults();
      updateSortButtons();
      updateUrlState();
    }

    function loadMoreRows() {
      if (state.visibleCount >= state.filtered.length) return;
      state.visibleCount = Math.min(state.visibleCount + LOAD_BATCH_SIZE, state.filtered.length);
      render();
    }

    function maybeLoadMoreRows() {
      const remaining = document.documentElement.scrollHeight - window.innerHeight - window.scrollY;
      if (remaining < 500) loadMoreRows();
    }

    function scheduleSearchFilter() {
      window.clearTimeout(searchFilterTimer);
      searchFilterTimer = window.setTimeout(() => {
        state.visibleCount = LOAD_BATCH_SIZE;
        applyFilters();
      }, SEARCH_DEBOUNCE_MS);
    }

    function defaultSortDir(key) {
      return key === "price" ? "asc" : "desc";
    }

    function toggledSortDir(key) {
      return defaultSortDir(key) === "asc" ? "desc" : "asc";
    }

    function setSort(key, shouldUpdateUrl) {
      if (!["price", "discountRate", "priceTimestamp"].includes(key)) return;
      if (!state.sortKey && key === "priceTimestamp") {
        state.sortKey = key;
        state.sortDir = "asc";
      } else if (state.sortKey !== key) {
        state.sortKey = key;
        state.sortDir = defaultSortDir(key);
      } else if (state.sortDir === defaultSortDir(key)) {
        state.sortDir = toggledSortDir(key);
      } else {
        state.sortKey = "";
        state.sortDir = "";
      }
      state.visibleCount = LOAD_BATCH_SIZE;
      applyFilters();
      if (shouldUpdateUrl !== false) updateUrlState();
    }

    function updateSortButtons() {
      const activeKey = state.sortKey || "priceTimestamp";
      const direction = state.sortDir || "desc";
      els.sortButtons.forEach((button) => {
        const active = button.dataset.sortKey === activeKey;
        button.setAttribute("aria-label", button.textContent + " 정렬" + (active ? (direction === "asc" ? ", 오름차순" : ", 내림차순") : ""));
        button.closest("th").setAttribute("aria-sort", active ? (direction === "asc" ? "ascending" : "descending") : "none");
      });
    }

    function updateResults() {
      els.resultCount.textContent = numberFormatter.format(state.filtered.length) + "개";
      els.searchClearButton.hidden = !els.searchInput.value;
      els.loadMoreButton.hidden = state.visibleCount >= state.filtered.length;
    }

    function renderRow(row) {
      const discountClass = row.discountRate === null ? "" : row.discountRate > 0 ? " down" : row.discountRate < 0 ? " up" : "";
      return [
        "<tr>",
        '<td><a class="product" href="' + escapeAttribute(productUrl(row.code)) + '" target="_blank" rel="noopener noreferrer">',
        renderImage(row),
        '<span class="name">' + escapeHtml(row.name) + '</span>',
        "</a></td>",
        '<td class="num delta' + discountClass + '" data-label="할인율"><span class="discount-value">' + percent(row.discountRate) + '</span></td>',
        '<td class="num" data-label="현재가"><button class="price-history-button" type="button" data-history-code="' + escapeAttribute(row.code) + '" aria-label="' + escapeAttribute(row.name + " 현재가 " + money(row.price) + ", 가격 이력 보기") + '" title="최근 30개 가격 기록 · 누르면 전체 이력"><strong class="current-price">' + money(row.price) + '</strong>' + renderSparkline(row) + '<span class="history-link">가격 이력 ↗</span></button></td>',
        '<td class="num" data-label="갱신일시">' + renderPriceAge(row) + '</td>',
        "</tr>"
      ].join("");
    }

    function preparePriceHistory(history = [], { from = -Infinity, to = Infinity } = {}) {
      const lowerBound = from instanceof Date ? from.getTime() : from;
      const upperBound = to instanceof Date ? to.getTime() : to;
      if (Number.isNaN(lowerBound) || Number.isNaN(upperBound) || lowerBound > upperBound) {
        throw new RangeError("Invalid price-history time range");
      }

      const byTime = new Map();
      let omittedTimestampCount = 0;
      for (const item of history) {
        const timestamp = item?.timestamp;
        const time = timestamp == null || timestamp === ""
          ? NaN
          : timestamp instanceof Date ? timestamp.getTime() : new Date(timestamp).getTime();
        if (!Number.isFinite(time)) {
          omittedTimestampCount += 1;
          continue;
        }
        if (time < lowerBound || time > upperBound) continue;
        if (!byTime.has(time)) byTime.set(time, new Set());
        const value = typeof item.value === "number" && Number.isFinite(item.value) && item.value >= 0
          ? item.value
          : null;
        byTime.get(time).add(value);
      }

      const records = [...byTime.entries()]
        .sort(([a], [b]) => a - b)
        .map(([time, values]) => ({
          time,
          price: values.size === 1 ? values.values().next().value : null
        }));
      const segments = [];
      let segment = [];
      let pointCount = 0;
      let minimum = Infinity;
      let maximum = -Infinity;
      let unknownPriceCount = 0;
      for (const observation of records) {
        if (observation.price === null) {
          if (segment.length) segments.push(segment);
          segment = [];
          unknownPriceCount += 1;
        } else {
          segment.push(observation);
          pointCount += 1;
          minimum = Math.min(minimum, observation.price);
          maximum = Math.max(maximum, observation.price);
        }
      }
      if (segment.length) segments.push(segment);

      const padding = pointCount ? Math.max((maximum - minimum) * 0.1, maximum * 0.025, 1) : 0;
      const domain = pointCount ? {
        start: records[0].time,
        end: records[records.length - 1].time,
        minimum,
        maximum,
        yMinimum: Math.max(0, minimum - padding),
        yMaximum: maximum + padding
      } : null;
      return { records, segments, pointCount, omittedTimestampCount, unknownPriceCount, domain };
    }

    function relativeTime(timestamp) {
      if (!timestamp || !Number.isFinite(timestamp.getTime())) return "-";
      const minutes = Math.floor(Math.max(0, Date.now() - timestamp.getTime()) / 60000);
      if (minutes < 1) return "방금";
      if (minutes < 60) return minutes + "분 전";
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return hours + "시간 전";
      const days = Math.floor(hours / 24);
      if (days < 30) return days + "일 전";
      if (days < 365) return Math.floor(days / 30) + "개월 전";
      return Math.floor(days / 365) + "년 전";
    }

    function renderPriceAge(row) {
      const exact = row.priceTimestamp ? dateFormatter.format(row.priceTimestamp) + " (한국 시간)" : "업데이트 일시 없음";
      return '<span class="price-age" data-price-time="' + (row.priceTimestamp ? row.priceTimestamp.getTime() : "") + '" title="' + escapeAttribute(exact) + '" aria-label="' + escapeAttribute("마지막 가격 업데이트: " + relativeTime(row.priceTimestamp) + ", " + exact) + '">' + relativeTime(row.priceTimestamp) + '</span>';
    }

    function updatePriceAges() {
      document.querySelectorAll("[data-price-time]").forEach((element) => {
        const time = element.dataset.priceTime;
        const text = relativeTime(time ? new Date(Number(time)) : null);
        element.textContent = text;
        element.setAttribute("aria-label", "마지막 가격 업데이트: " + text + ", " + element.title);
      });
    }

    function graphGeometry(series, width, height, padding) {
      const domain = series.domain;
      return {
        x: time => domain.end === domain.start ? width / 2 : padding.left + (time - domain.start) / (domain.end - domain.start) * (width - padding.left - padding.right),
        y: price => height - padding.bottom - (price - domain.yMinimum) / (domain.yMaximum - domain.yMinimum) * (height - padding.top - padding.bottom)
      };
    }

    function graphLines(series, geometry) {
      return series.segments.map(segment => {
        let path = "M " + geometry.x(segment[0].time) + " " + geometry.y(segment[0].price);
        for (const point of segment.slice(1)) path += " H " + geometry.x(point.time) + " V " + geometry.y(point.price);
        return '<path d="' + path + '" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>';
      }).join("");
    }

    function renderSparkline(row) {
      const records = row.priceSeries.records.slice(-30);
      const series = preparePriceHistory(records.map(point => ({ timestamp: new Date(point.time), value: point.price })));
      if (!series.domain) return '<svg class="price-sparkline" viewBox="0 0 100 24" aria-hidden="true"><path d="M 2 12 H 98" stroke="var(--line)" stroke-dasharray="3 3"/></svg>';
      const geometry = graphGeometry(series, 100, 24, { left: 3, right: 3, top: 2, bottom: 2 });
      const points = series.segments.flat();
      return '<svg class="price-sparkline" viewBox="0 0 100 24" aria-hidden="true" style="color:var(--accent)">' + graphLines(series, geometry) + points.map(point => '<circle cx="' + geometry.x(point.time) + '" cy="' + geometry.y(point.price) + '" r="1.8" fill="currentColor"/>').join("") + '</svg>';
    }

    function historicalDiscountRates(code, records) {
      const history = state.basePriceHistory.get(code) || [];
      // An undated baseline cannot be reliably assigned to a historical price.
      const prepared = preparePriceHistory(history);
      if (prepared.omittedTimestampCount) return new Map();
      const baselines = prepared.records;
      const rates = new Map();
      let index = 0;
      let baseline = null;
      for (const point of records) {
        while (index < baselines.length && baselines[index].time <= point.time) baseline = baselines[index++].price;
        rates.set(point.time, point.price !== null && baseline > 0 ? (baseline - point.price) / baseline * 100 : null);
      }
      return rates;
    }

    function renderHistory() {
      const row = state.rows.find(item => item.code === state.historyCode);
      if (!row) return;
      const days = Number(els.historyRangeSelect.value);
      const series = preparePriceHistory(state.priceHistory.get(row.code) || [], { from: days ? Date.now() - days * 86400000 : -Infinity });
      els.historyTitle.textContent = row.name;
      els.historyEmpty.hidden = series.pointCount !== 0;
      els.historyPointSummary.textContent = series.pointCount ? numberFormatter.format(series.pointCount) + "개 기록" : "기록 없음";
      const notes = [];
      if (series.omittedTimestampCount) notes.push("일시가 없는 기록 " + series.omittedTimestampCount + "개는 그래프에서 제외했습니다.");
      if (series.unknownPriceCount) notes.push("가격을 확인할 수 없는 구간은 선을 연결하지 않았습니다.");
      els.historyNote.textContent = notes.join(" ");
      els.historyNote.hidden = !notes.length;
      const rates = historicalDiscountRates(row.code, series.records);
      els.historyRows.innerHTML = series.records.slice().reverse().map(point => '<tr><td>' + escapeHtml(dateFormatter.format(new Date(point.time))) + '</td><td class="num">' + money(point.price) + '</td><td class="num">' + percent(rates.get(point.time) ?? null) + '</td></tr>').join("");
      if (!series.domain) {
        els.historyChart.innerHTML = '<p class="price-age">표시할 가격 기록이 없습니다.</p>';
        return;
      }
      const width = window.matchMedia("(max-width: 640px)").matches ? 360 : 720;
      const height = width === 360 ? 220 : 260;
      const geometry = graphGeometry(series, width, height, { left: 80, right: 18, top: 18, bottom: 32 });
      const domain = series.domain;
      const points = series.segments.flat();
      const year = time => new Intl.DateTimeFormat("en", { timeZone: "Asia/Seoul", year: "numeric" }).format(new Date(time));
      const dateLabel = time => new Intl.DateTimeFormat("ko-KR", { timeZone: "Asia/Seoul", ...(year(domain.start) !== year(domain.end) ? { year: "numeric" } : {}), month: "numeric", day: "numeric" }).format(new Date(time));
      const levels = domain.minimum === domain.maximum ? [domain.minimum] : [domain.minimum, domain.maximum];
      const axes = levels.map(price => '<line x1="80" x2="' + (width - 18) + '" y1="' + geometry.y(price) + '" y2="' + geometry.y(price) + '" stroke="var(--line)"/><text x="70" y="' + (geometry.y(price) + 4) + '" text-anchor="end" fill="var(--muted)" font-size="12">' + money(price) + '</text>').join("");
      const dateLabels = domain.start === domain.end
        ? '<text x="' + width / 2 + '" y="' + (height - 10) + '" text-anchor="middle" fill="var(--muted)" font-size="12">' + dateLabel(domain.start) + '</text>'
        : '<text x="80" y="' + (height - 10) + '" fill="var(--muted)" font-size="12">' + dateLabel(domain.start) + '</text><text x="' + (width - 18) + '" y="' + (height - 10) + '" text-anchor="end" fill="var(--muted)" font-size="12">' + dateLabel(domain.end) + '</text>';
      els.historyChart.innerHTML = '<svg class="history-chart" viewBox="0 0 ' + width + ' ' + height + '" role="img" tabindex="0" aria-label="' + escapeAttribute(row.name + " 가격 그래프. 좌우 방향키로 기록을 확인할 수 있습니다. 아래 표에서도 모든 기록을 볼 수 있습니다.") + '" style="color:var(--accent)">' + axes + dateLabels + graphLines(series, geometry) + points.map(point => '<circle data-price="' + point.price + '" data-timestamp="' + point.time + '" cx="' + geometry.x(point.time) + '" cy="' + geometry.y(point.price) + '" r="3.5" fill="currentColor"><title>' + escapeHtml(dateFormatter.format(new Date(point.time)) + " · " + money(point.price)) + '</title></circle>').join("") + '</svg>';
      const svg = els.historyChart.querySelector("svg");
      const circles = [...svg.querySelectorAll("circle")];
      let selected = points.length - 1;
      function selectPoint(index) {
        selected = Math.max(0, Math.min(points.length - 1, index));
        const point = points[selected];
        els.historyPointSummary.textContent = dateFormatter.format(new Date(point.time)) + " · " + money(point.price);
        circles.forEach((circle, i) => circle.setAttribute("r", i === selected ? "5" : "3.5"));
      }
      svg.addEventListener("pointermove", event => {
        const box = svg.getBoundingClientRect();
        const x = (event.clientX - box.left) / box.width * width;
        let closest = 0;
        for (let i = 1; i < points.length; i++) if (Math.abs(geometry.x(points[i].time) - x) < Math.abs(geometry.x(points[closest].time) - x)) closest = i;
        selectPoint(closest);
      });
      svg.addEventListener("keydown", event => {
        if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
        event.preventDefault();
        selectPoint(event.key === "Home" ? 0 : event.key === "End" ? points.length - 1 : selected + (event.key === "ArrowLeft" ? -1 : 1));
      });
      svg.addEventListener("focus", () => selectPoint(selected));
    }

    function openHistory(code, trigger) {
      if (!state.rows.some(row => row.code === code)) return;
      setFilterPanel(false);
      if (els.historyModal.hidden) {
        state.historyReturnFocus = trigger || document.activeElement;
        state.previousBodyOverflow = document.body.style.overflow;
        els.historyRangeSelect.value = "all";
      }
      state.historyCode = code;
      renderHistory();
      els.historyModal.hidden = false;
      document.querySelector("main").inert = true;
      document.body.style.overflow = "hidden";
      els.historyCloseButton.focus();
      updateUrlState();
    }

    function closeHistory() {
      if (els.historyModal.hidden) return;
      els.historyModal.hidden = true;
      document.querySelector("main").inert = false;
      document.body.style.overflow = state.previousBodyOverflow || "";
      const code = state.historyCode;
      state.historyCode = "";
      updateUrlState();
      const trigger = state.historyReturnFocus;
      const fallback = [...els.rows.querySelectorAll("[data-history-code]")].find(button => button.dataset.historyCode === code);
      const target = trigger?.isConnected ? trigger : fallback || els.searchInput;
      target.focus({ preventScroll: true });
    }

    function setFilterPanel(open, returnFocus = false) {
      els.filterToggleButton.setAttribute("aria-expanded", String(open && compactFilters.matches));
      if (returnFocus) els.filterToggleButton.focus();
    }

    function trapHistoryFocus(event) {
      if (els.historyModal.hidden || event.key !== "Tab") return;
      const focusable = [...els.historyModal.querySelectorAll('button, select, [tabindex="0"]')].filter(element => element.getClientRects().length && !element.disabled);
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault(); last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault(); first.focus();
      }
    }

    function openDb() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => {
          dbPromise = null;
          reject(request.error);
        };
      });
      return dbPromise;
    }

    async function getDbValue(key, fallback) {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const request = db.transaction(DB_STORE, "readonly").objectStore(DB_STORE).get(key);
        request.onsuccess = () => resolve(request.result === undefined ? fallback : request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function setDbValue(key, value) {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const request = db.transaction(DB_STORE, "readwrite").objectStore(DB_STORE).put(value, key);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    }

    async function getAlertCodes() {
      try {
        const saved = await getDbValue(STORAGE_KEYS.alertCodes, []);
        return new Set(Array.isArray(saved) ? saved.map(cleanCode).filter(Boolean) : []);
      } catch (error) {
        console.warn("알림 설정을 불러오지 못했습니다.", error);
        return new Set();
      }
    }

    async function readPriceSnapshot() {
      try {
        const saved = await getDbValue(STORAGE_KEYS.priceSnapshot, {});
        return saved && typeof saved === "object" ? saved : {};
      } catch (error) {
        return {};
      }
    }

    async function savePriceSnapshot(rows) {
      const alertCodes = await getAlertCodes();
      const snapshot = {};
      rows.forEach((row) => {
        if (!row.code || !alertCodes.has(row.code)) return;
        snapshot[row.code] = {
          price: row.price,
          basePrice: row.basePrice,
          name: row.name,
          updatedAt: row.priceTimestamp ? row.priceTimestamp.toISOString() : null
        };
      });
      await setDbValue(STORAGE_KEYS.priceSnapshot, snapshot);
    }

    async function detectPriceChanges(rows) {
      const previous = await readPriceSnapshot();
      const alertCodes = await getAlertCodes();
      return rows
        .filter((row) => alertCodes.has(row.code))
        .map((row) => {
          const old = previous[row.code];
          if (!old || old.price === null || row.price === null || old.price === row.price) return null;
          return {
            code: row.code,
            name: row.name,
            oldPrice: old.price,
            newPrice: row.price,
            direction: row.price > old.price ? "up" : "down"
          };
        })
        .filter(Boolean);
    }

    async function notifyPriceChanges(changes) {
      if (!changes.length || !canShowNotifications()) return;
      await ensureServiceWorker();
      const visibleChanges = changes.slice(0, 5);
      visibleChanges.forEach((change) => {
        showAppNotification(
          change.direction === "down" ? "가격이 내려갔습니다" : "가격이 올랐습니다",
          change.name + "\n" + money(change.oldPrice) + " → " + money(change.newPrice),
          { productCode: change.code, url: productUrl(change.code) }
        );
      });
      if (changes.length > visibleChanges.length) {
        showAppNotification("가격 변동 알림", "추가 " + numberFormatter.format(changes.length - visibleChanges.length) + "개 상품의 가격이 바뀌었습니다.", {});
      }
    }

    function canShowNotifications() {
      return "Notification" in window && Notification.permission === "granted";
    }

    async function ensureServiceWorker() {
      if (!("serviceWorker" in navigator)) return null;
      if (state.serviceWorkerRegistration) return state.serviceWorkerRegistration;
      try {
        state.serviceWorkerRegistration = await navigator.serviceWorker.register("sw.js");
        return state.serviceWorkerRegistration;
      } catch (error) {
        console.warn("서비스워커를 등록하지 못했습니다.", error);
        return null;
      }
    }

    async function registerPeriodicPriceCheck() {
      const registration = await ensureServiceWorker();
      if (!registration || !("periodicSync" in registration) || !canShowNotifications()) return false;
      try {
        await registration.periodicSync.register("price-check", { minInterval: PRICE_CHECK_INTERVAL_MS });
        return true;
      } catch (error) {
        console.warn("백그라운드 주기 확인을 등록하지 못했습니다.", error);
        return false;
      }
    }

    function requestServiceWorkerPriceCheck() {
      if (!state.serviceWorkerRegistration || !state.serviceWorkerRegistration.active) return;
      state.serviceWorkerRegistration.active.postMessage({ type: "CHECK_PRICES" });
    }

    function showAppNotification(title, body, data) {
      const options = {
        body,
        tag: data.productCode ? "costco-price-" + data.productCode : "costco-price-summary",
        data,
        icon: "icon.svg",
        badge: "icon.svg"
      };
      if (state.serviceWorkerRegistration) {
        state.serviceWorkerRegistration.showNotification(title, options);
      } else {
        new Notification(title, options);
      }
    }

    function productUrl(code) {
      return "http://costco.co.kr/p/" + encodeURIComponent(code || "");
    }

    function renderImage(row) {
      const src = imageUrl(row.image);
      if (!src) return "<div class=\"thumb missing\">NO IMG</div>";
      return "<img class=\"thumb\" src=\"" + escapeAttribute(src) + "\" alt=\"\" loading=\"lazy\" onerror=\"this.replaceWith(Object.assign(document.createElement('div'),{className:'thumb missing',textContent:'NO IMG'}))\">";
    }

    function imageUrl(value) {
      const src = String(value || "").trim();
      if (!src) return "";
      if (/^https?:\/\//i.test(src)) return src;
      if (src.startsWith("//")) return "https:" + src;
      if (src.startsWith("/")) return "https://www.costco.co.kr" + src;
      return src;
    }

    function money(value) {
      return value === null ? "-" : moneyFormatter.format(value);
    }

    function percent(value) {
      if (value === null) return "-";
      return value.toFixed(1) + "%";
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/`/g, "&#096;");
    }

    function resetFilters() {
      window.clearTimeout(searchFilterTimer);
      els.searchInput.value = "";
      resetProductStatusFilterAvailability();
      els.inStockOnlyInput.checked = true;
      els.discountOnlyInput.checked = true;
      setDefaultPriceRange();
      state.sortKey = "";
      state.sortDir = "";
      state.visibleCount = LOAD_BATCH_SIZE;
      applyFilters();
    }

    function restoreStateFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const min = params.get("min");
      const max = params.get("max");
      const stock = params.get("stock");
      const discount = params.get("discount");
      const sortKey = params.get("sort");
      const sortDir = params.get("dir");

      els.searchInput.value = params.get("q") || "";
      els.inStockOnlyInput.checked = stock !== "0";
      els.discountOnlyInput.checked = discount !== "0";
      if (min !== null) els.minPriceInput.value = String(Math.max(0, Number(min) || 0));
      if (max !== null) {
        const maxValue = Number(max);
        els.maxPriceInput.value = String(Number.isFinite(maxValue) ? Math.min(state.defaultMaxPrice, Math.max(0, maxValue)) : state.defaultMaxPrice);
      }
      clampPriceInputs();
      if (["price", "discountRate", "priceTimestamp"].includes(sortKey)) {
        state.sortKey = sortKey;
        state.sortDir = sortDir === toggledSortDir(sortKey) ? sortDir : defaultSortDir(sortKey);
      }
    }

    function updateUrlState() {
      if (state.isRestoring) return;
      const params = new URLSearchParams();
      const query = els.searchInput.value.trim();
      const min = parsePriceInput(els.minPriceInput.value, 0);
      const max = parsePriceInput(els.maxPriceInput.value, state.defaultMaxPrice);

      if (query) params.set("q", query);
      if (!els.inStockOnlyInput.checked) params.set("stock", "0");
      if (!els.discountOnlyInput.checked) params.set("discount", "0");
      if (min !== 0) params.set("min", String(min));
      if (max !== state.defaultMaxPrice) params.set("max", String(max));
      if (state.sortKey) {
        params.set("sort", state.sortKey);
        params.set("dir", state.sortDir);
      }

      if (state.historyCode) params.set("history", state.historyCode);

      const queryString = params.toString();
      const nextUrl = window.location.pathname + (queryString ? "?" + queryString : "") + window.location.hash;
      window.history.replaceState(null, "", nextUrl);
    }

    els.searchInput.addEventListener("input", () => {
      els.searchClearButton.hidden = !els.searchInput.value;
      scheduleSearchFilter();
    });
    els.searchClearButton.addEventListener("click", () => {
      window.clearTimeout(searchFilterTimer);
      els.searchInput.value = "";
      state.visibleCount = LOAD_BATCH_SIZE;
      applyFilters();
      els.searchInput.focus();
    });
    els.clearFiltersButton.addEventListener("click", () => {
      window.clearTimeout(searchFilterTimer);
      els.searchInput.value = "";
      els.inStockOnlyInput.checked = false;
      els.discountOnlyInput.checked = false;
      setDefaultPriceRange();
      state.visibleCount = LOAD_BATCH_SIZE;
      applyFilters();
      els.searchInput.focus();
    });
    els.loadMoreButton.addEventListener("click", loadMoreRows);
    els.productsRefreshButton.addEventListener("click", loadAll);
    els.minPriceInput.addEventListener("input", () => {
      clampPriceInputs();
      state.visibleCount = LOAD_BATCH_SIZE;
      applyFilters();
    });
    els.maxPriceInput.addEventListener("input", () => {
      clampPriceInputs();
      state.visibleCount = LOAD_BATCH_SIZE;
      applyFilters();
    });
    els.inStockOnlyInput.addEventListener("change", () => {
      state.visibleCount = LOAD_BATCH_SIZE;
      applyFilters();
    });
    els.discountOnlyInput.addEventListener("change", () => {
      state.visibleCount = LOAD_BATCH_SIZE;
      applyFilters();
    });
    els.resetButton.addEventListener("click", resetFilters);
    els.titleResetButton.addEventListener("click", resetFilters);
    window.addEventListener("scroll", maybeLoadMoreRows, { passive: true });
    els.sortButtons.forEach((button) => {
      button.addEventListener("click", () => setSort(button.dataset.sortKey));
    });
    els.rows.addEventListener("click", event => {
      const trigger = event.target.closest("[data-history-code]");
      if (trigger) openHistory(trigger.dataset.historyCode, trigger);
    });
    els.historyCloseButton.addEventListener("click", closeHistory);
    els.historyRangeSelect.addEventListener("change", renderHistory);
    els.historyModal.addEventListener("click", event => {
      if (event.target === els.historyModal) closeHistory();
    });
    els.filterToggleButton.addEventListener("click", () => {
      setFilterPanel(els.filterToggleButton.getAttribute("aria-expanded") !== "true");
    });
    document.addEventListener("click", event => {
      if (!els.productToolbar.contains(event.target)) setFilterPanel(false);
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        if (!els.historyModal.hidden) closeHistory();
        else if (els.filterToggleButton.getAttribute("aria-expanded") === "true") setFilterPanel(false, true);
      }
      trapHistoryFocus(event);
    });
    compactFilters.addEventListener("change", () => setFilterPanel(false));
    document.getElementById("themeToggleButton").addEventListener("click", () => {
      applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark", true);
    });
    systemTheme.addEventListener("change", event => {
      if (!["dark", "light"].includes(preferredTheme)) applyTheme(event.matches ? "dark" : "light");
    });
    applyTheme(document.documentElement.dataset.theme);
    new ResizeObserver(entries => {
      document.documentElement.style.setProperty("--toolbar-height", entries[0].target.getBoundingClientRect().height + "px");
    }).observe(els.productToolbar);

    async function init() {
      await ensureServiceWorker();
      await registerPeriodicPriceCheck();
      loadAll();
      window.setInterval(requestServiceWorkerPriceCheck, PRICE_CHECK_INTERVAL_MS);
      window.setInterval(updatePriceAges, 60000);
    }

    init();
  </script>
</body>
</html>
