<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>코스트코 온라인몰 할인 추적기</title>
  <meta name="description" content="Costco 상품의 현재가, 기준가, 할인율과 가격 이력을 한 화면에서 검색, 필터, 정렬해 비교합니다.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0f766e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="코스트코 가격">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="코스트코 온라인몰 할인 추적기">
  <meta property="og:description" content="Costco 상품의 현재가, 기준가, 할인율과 가격 이력을 검색하고 비교합니다.">
  <meta property="og:site_name" content="코스트코 온라인몰 할인 추적기">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="코스트코 온라인몰 할인 추적기">
  <meta name="twitter:description" content="Costco 상품의 현재가, 기준가, 할인율과 가격 이력을 검색하고 비교합니다.">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "코스트코 온라인몰 할인 추적기",
      "applicationCategory": "ShoppingApplication",
      "operatingSystem": "Any",
      "inLanguage": "ko-KR",
      "description": "Costco 상품의 현재가, 기준가, 할인율과 가격 이력을 검색하고 비교하는 정적 웹 애플리케이션입니다."
    }
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fa;
      --surface: #ffffff;
      --surface-2: #eef3f7;
      --text: #17212b;
      --muted: #627082;
      --line: #d8e0e8;
      --accent: #0f766e;
      --accent-2: #c2410c;
      --ok: #137333;
      --warn: #b45309;
      --bad: #b91c1c;
      --shadow: 0 10px 30px rgba(23, 33, 43, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      min-height: 40px;
      padding: 0 12px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      padding: 0 11px;
    }

    .shell {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 18px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 18px 0 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 36px);
      letter-spacing: 0;
      line-height: 1.1;
    }

    .title-button {
      display: inline;
      min-height: auto;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-weight: inherit;
      text-align: left;
    }

    .meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1.2fr) repeat(2, minmax(104px, 0.5fr)) minmax(172px, auto) max-content;
      gap: 10px;
      align-items: end;
      margin: 12px 0 18px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .check-group {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      min-height: 40px;
    }

    .field .check-filter {
      display: inline-flex;
      gap: 7px;
      align-items: center;
      min-height: 34px;
      margin-bottom: 0;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .field .check-filter:has(input:checked) {
      border-color: var(--accent);
      background: #ecfdf5;
      color: var(--accent);
    }

    .field .check-filter:has(input:disabled) {
      opacity: 0.52;
      cursor: not-allowed;
    }

    .field .check-filter input {
      width: 16px;
      min-width: 16px;
      height: 16px;
      min-height: 16px;
      margin: 0;
      padding: 0;
      accent-color: var(--accent);
    }

    #resetButton {
      width: auto;
      min-width: 72px;
      padding: 0 14px;
      white-space: nowrap;
      justify-self: start;
    }

    .status {
      display: flex;
      gap: 10px;
      align-items: center;
      min-height: 44px;
      margin-bottom: 14px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 14px;
    }

    .status[hidden] {
      display: none;
    }

    .status.error {
      border-color: #fecaca;
      background: #fff1f2;
      color: var(--bad);
    }

    .alert-button {
      min-height: 34px;
      padding: 0 10px;
      white-space: nowrap;
    }

    .alert-button.active {
      border-color: var(--accent);
      background: #ecfdf5;
      color: var(--accent);
      font-weight: 800;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #cbd5e1;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex: 0 0 auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    table {
      width: 100%;
      min-width: 940px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f8fafc;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .sort-button {
      display: inline-flex;
      justify-content: inherit;
      align-items: center;
      gap: 6px;
      width: 100%;
      min-height: auto;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-weight: inherit;
      text-align: inherit;
    }

    th.num .sort-button {
      justify-content: flex-end;
      text-align: right;
    }

    .sort-button::after {
      content: "↕";
      color: #94a3b8;
      font-size: 11px;
    }

    .sort-button[aria-sort="ascending"]::after {
      content: "↑";
      color: var(--accent);
    }

    .sort-button[aria-sort="descending"]::after {
      content: "↓";
      color: var(--accent);
    }

    tbody tr:hover {
      background: #f8fafc;
    }

    .product {
      display: grid;
      grid-template-columns: 54px minmax(220px, 1fr);
      gap: 10px;
      align-items: center;
      color: inherit;
      text-decoration: none;
    }

    .product:hover .name {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .thumb {
      width: 54px;
      height: 54px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #eef2f6;
      object-fit: cover;
    }

    .thumb.missing {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 11px;
    }

    .name {
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    .product-text {
      min-width: 0;
    }

    .code-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    .code-row .chip {
      min-height: 18px;
      padding: 0 6px;
      font-size: 11px;
      line-height: 18px;
    }

    .code {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }

    .num {
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .subtext {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: normal;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 0 9px;
      border-radius: 999px;
      background: #e8f5e9;
      color: var(--ok);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .chip.off {
      background: #fee2e2;
      color: var(--bad);
    }

    .chip.dim {
      background: #eef2f7;
      color: var(--muted);
    }

    .delta.up {
      color: var(--bad);
      font-weight: 800;
    }

    .delta.down {
      color: var(--ok);
      font-weight: 800;
    }

    .history-button {
      min-height: 34px;
      padding: 0 10px;
      white-space: nowrap;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(15, 23, 42, 0.45);
    }

    .modal[hidden] {
      display: none;
    }

    .dialog {
      width: min(920px, 100%);
      max-height: min(760px, calc(100vh - 36px));
      overflow: hidden;
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.28);
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .dialog-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .dialog-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
    }

    .dialog-subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .dialog-body {
      overflow: auto;
      padding: 0;
    }

    .chart-panel {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--line);
    }

    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .legend-item {
      display: inline-flex;
      gap: 6px;
      align-items: center;
    }

    .legend-swatch {
      width: 18px;
      height: 3px;
      border-radius: 999px;
      background: var(--accent);
    }

    .legend-swatch.base {
      background: var(--accent-2);
    }

    .history-chart {
      width: 100%;
      height: 260px;
      display: block;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfdff;
    }

    .history-table {
      min-width: 620px;
      box-shadow: none;
    }

    .history-table th,
    .history-table td {
      padding: 10px 14px;
    }

    .empty {
      padding: 52px 16px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .topbar,
      .toolbar {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: stretch;
      }
    }

    @media (max-width: 720px) {
      .shell {
        padding: 10px;
      }

      .topbar {
        gap: 12px;
        padding-top: 10px;
      }

      h1 {
        font-size: 26px;
        line-height: 1.15;
      }

      .meta {
        font-size: 13px;
      }

      .toolbar {
        gap: 9px;
        margin-bottom: 12px;
        padding: 12px;
      }

      #resetButton {
        width: 100%;
        justify-self: stretch;
      }

      .check-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .field .check-filter {
        justify-content: center;
      }

      .status {
        align-items: flex-start;
        margin-bottom: 12px;
        font-size: 13px;
      }

      .table-wrap {
        overflow: visible;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }

      table,
      thead,
      tbody,
      tr,
      td {
        display: block;
      }

      table {
        min-width: 0;
      }

      thead {
        display: block;
        margin-bottom: 12px;
      }

      thead tr {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      th {
        display: block;
        min-height: 38px;
        padding: 0;
        border: 0;
        border-right: 1px solid var(--line);
        background: var(--surface);
        font-size: 12px;
        text-align: center;
      }

      th:first-child,
      th:nth-last-child(-n + 2) {
        display: none;
      }

      th:nth-child(3) {
        border-right: 0;
      }

      .sort-button {
        justify-content: center;
        min-height: 38px;
        padding: 0 8px;
        text-align: center;
      }

      .sort-button[aria-sort="ascending"],
      .sort-button[aria-sort="descending"] {
        background: #ecfdf5;
        color: var(--accent);
      }

      tbody {
        display: grid;
        gap: 10px;
      }

      tbody tr {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px 12px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      tbody tr:hover {
        background: var(--surface);
      }

      td {
        min-width: 0;
        padding: 0;
        border-bottom: 0;
      }

      td:first-child {
        grid-column: 1 / -1;
      }

      td:nth-last-child(2) {
        grid-column: 1;
      }

      td:last-child {
        grid-column: 2;
      }

      td:not(:first-child)::before {
        content: attr(data-label);
        display: block;
        margin-bottom: 2px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
      }

      td:nth-last-child(-n + 2)::before {
        content: none;
      }

      .product {
        grid-template-columns: 64px minmax(0, 1fr);
        gap: 11px;
      }

      .thumb {
        width: 64px;
        height: 64px;
      }

      .name {
        font-size: 15px;
        line-height: 1.35;
      }

      .num {
        text-align: left;
      }

      .history-button {
        width: 100%;
        min-height: 38px;
      }

      .alert-button {
        width: 100%;
        min-height: 38px;
      }

      .modal {
        align-items: end;
        padding: 0;
      }

      .dialog {
        width: 100%;
        max-height: 92dvh;
        border-radius: 14px 14px 0 0;
        grid-template-rows: auto minmax(0, 1fr);
      }

      .dialog-head {
        gap: 12px;
        align-items: center;
        padding: 14px 14px 12px;
      }

      .dialog-title {
        font-size: 16px;
        line-height: 1.3;
      }

      .dialog-subtitle {
        font-size: 12px;
      }

      #historyCloseButton {
        min-width: 54px;
        min-height: 36px;
        padding: 0 10px;
      }

      .dialog-body {
        min-height: 0;
        padding-bottom: env(safe-area-inset-bottom);
      }

      .chart-panel {
        padding: 12px 12px 10px;
      }

      .history-chart {
        height: 190px;
      }

      .history-table {
        min-width: 0;
      }

      .history-table thead {
        display: none;
      }

      .history-table tbody tr {
        grid-template-columns: 1fr 1fr;
        gap: 8px 12px;
        margin: 0 12px 10px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: none;
      }

      .history-table tbody tr:first-child {
        margin-top: 12px;
      }

      .history-table td:first-child {
        grid-column: 1 / -1;
        font-weight: 800;
      }

      .history-table td:nth-last-child(3),
      .history-table td:nth-last-child(2),
      .history-table td:last-child {
        grid-column: auto;
      }

      .history-table td:nth-last-child(-n + 3)::before {
        content: attr(data-label);
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1><button class="title-button" id="titleResetButton" type="button">코스트코 온라인몰 할인 추적기</button></h1>
        <div class="meta" id="meta">데이터를 불러오는 중입니다.</div>
      </div>
    </header>

    <section class="toolbar" aria-label="상품 필터">
      <div class="field">
        <label for="searchInput">검색</label>
        <input id="searchInput" type="search" placeholder="상품명 또는 코드">
      </div>
      <div class="field">
        <label for="minPriceInput">현재가 최소</label>
        <input id="minPriceInput" type="number" min="0" step="100" inputmode="numeric" value="0" required>
      </div>
      <div class="field">
        <label for="maxPriceInput">현재가 최대</label>
        <input id="maxPriceInput" type="number" min="0" step="100" inputmode="numeric" required>
      </div>
      <div class="field">
        <label>상품 상태</label>
        <div class="check-group">
          <label class="check-filter"><input id="inStockOnlyInput" type="checkbox" checked> 판매 상품만</label>
          <label class="check-filter"><input id="discountOnlyInput" type="checkbox" checked> 할인 상품만</label>
        </div>
      </div>
      <button id="resetButton" type="button">초기화</button>
    </section>

    <div class="status" id="status" hidden></div>

    <section class="table-wrap" aria-label="상품 가격 목록">
      <table>
        <thead>
          <tr>
            <th>상품</th>
            <th class="num"><button class="sort-button" type="button" data-sort-key="price">현재가</button></th>
            <th class="num"><button class="sort-button" type="button" data-sort-key="discountRate">할인율</button></th>
            <th>이력</th>
            <th id="alertColumnHeader" hidden>알림</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden>조건에 맞는 상품이 없습니다.</div>
    </section>

  </main>

  <div class="modal" id="historyModal" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
      <header class="dialog-head">
        <div>
          <h2 class="dialog-title" id="historyTitle">가격 이력</h2>
          <div class="dialog-subtitle" id="historySubtitle"></div>
        </div>
        <button id="historyCloseButton" type="button">닫기</button>
      </header>
      <div class="dialog-body">
        <div class="chart-panel">
          <div class="chart-legend">
            <span class="legend-item"><span class="legend-swatch base"></span>기준가</span>
            <span class="legend-item"><span class="legend-swatch"></span>현재가</span>
          </div>
          <div id="historyChart"></div>
        </div>
        <table class="history-table">
          <thead>
            <tr>
              <th>시각</th>
              <th class="num">기준가</th>
              <th class="num">현재가</th>
              <th class="num">할인율</th>
            </tr>
          </thead>
          <tbody id="historyRows"></tbody>
        </table>
        <div class="empty" id="historyEmpty" hidden>가격 이력이 없습니다.</div>
      </div>
    </section>
  </div>

  <script>
    "use strict";

    const SOURCES = {
      products: {
        csv: "https://docs.google.com/spreadsheets/d/1JhhzwsnZoQjzd1xksaqnNjuk2oVc5tjrCPbxNcWAUsk/gviz/tq?tqx=out:csv&sheet=products",
        columns: ["code", "name", "image", "stock"]
      },
      prices: {
        csv: "https://docs.google.com/spreadsheets/d/1JhhzwsnZoQjzd1xksaqnNjuk2oVc5tjrCPbxNcWAUsk/gviz/tq?tqx=out:csv&sheet=prices",
        columns: ["code", "price", "timestamp"]
      },
      basePrices: {
        csv: "https://docs.google.com/spreadsheets/d/1JhhzwsnZoQjzd1xksaqnNjuk2oVc5tjrCPbxNcWAUsk/gviz/tq?tqx=out:csv&sheet=basePrices",
        columns: ["code", "basePrice", "timestamp"]
      }
    };

    const STORAGE_KEYS = {
      alertCodes: "costco-alert-codes-v1",
      priceSnapshot: "costco-price-snapshot-v1"
    };
    const DB_NAME = "costco-price-alerts";
    const DB_VERSION = 1;
    const DB_STORE = "kv";
    const PRICE_CHECK_INTERVAL_MS = 60 * 60 * 1000;

    const state = {
      products: [],
      rows: [],
      filtered: [],
      priceHistory: new Map(),
      basePriceHistory: new Map(),
      serviceWorkerRegistration: null,
      visibleCount: 20,
      sortKey: "",
      sortDir: "",
      defaultMaxPrice: 0,
      restoredHistoryCode: "",
      isRestoring: true,
      loadedAt: null,
      canConfigureNotifications: false,
      notificationPermissionPromptDismissed: false,
      renderId: 0
    };

    const LOAD_BATCH_SIZE = 20;
    const SEARCH_DEBOUNCE_MS = 120;
    let searchFilterTimer = 0;
    let dbPromise = null;

    const els = {
      meta: document.getElementById("meta"),
      status: document.getElementById("status"),
      rows: document.getElementById("rows"),
      empty: document.getElementById("empty"),
      searchInput: document.getElementById("searchInput"),
      minPriceInput: document.getElementById("minPriceInput"),
      maxPriceInput: document.getElementById("maxPriceInput"),
      inStockOnlyInput: document.getElementById("inStockOnlyInput"),
      discountOnlyInput: document.getElementById("discountOnlyInput"),
      resetButton: document.getElementById("resetButton"),
      titleResetButton: document.getElementById("titleResetButton"),
      alertColumnHeader: document.getElementById("alertColumnHeader"),
      historyModal: document.getElementById("historyModal"),
      historyTitle: document.getElementById("historyTitle"),
      historySubtitle: document.getElementById("historySubtitle"),
      historyChart: document.getElementById("historyChart"),
      historyRows: document.getElementById("historyRows"),
      historyEmpty: document.getElementById("historyEmpty"),
      historyCloseButton: document.getElementById("historyCloseButton"),
      sortButtons: document.querySelectorAll("[data-sort-key]")
    };

    const moneyFormatter = new Intl.NumberFormat("ko-KR", {
      style: "currency",
      currency: "KRW",
      maximumFractionDigits: 0
    });

    const numberFormatter = new Intl.NumberFormat("ko-KR");
    const dateFormatter = new Intl.DateTimeFormat("ko-KR", {
      timeZone: "Asia/Seoul",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    });

    function setStatus(message, isError) {
      els.status.hidden = false;
      els.status.className = isError ? "status error" : "status";
      els.status.innerHTML = isError
        ? "<span>" + escapeHtml(message) + "</span>"
        : "<span class=\"spinner\"></span><span>" + escapeHtml(message) + "</span>";
    }

    function setReadyStatus() {
      els.status.hidden = true;
      els.status.className = "status";
      els.status.innerHTML = "";
    }

    function showNotice(message) {
      window.alert(message);
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let value = "";
      let quoted = false;

      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        const next = text[i + 1];

        if (quoted) {
          if (char === "\"" && next === "\"") {
            value += "\"";
            i += 1;
          } else if (char === "\"") {
            quoted = false;
          } else {
            value += char;
          }
        } else if (char === "\"") {
          quoted = true;
        } else if (char === ",") {
          row.push(value);
          value = "";
        } else if (char === "\n") {
          row.push(value);
          rows.push(row);
          row = [];
          value = "";
        } else if (char !== "\r") {
          value += char;
        }
      }

      if (value.length || row.length) {
        row.push(value);
        rows.push(row);
      }

      return rows.filter((item) => item.some((cell) => cell.trim() !== ""));
    }

    function rowsToObjects(rows, fallbackColumns) {
      if (!rows.length) return [];
      const first = rows[0].map((header) => String(header || "").trim().replace(/\s+/g, "").toLowerCase());
      const hasHeader = fallbackColumns.every((column) => first.includes(column.toLowerCase()));
      const headers = hasHeader
        ? rows[0].map((header) => String(header || "").trim())
        : fallbackColumns;
      const dataRows = hasHeader ? rows.slice(1) : rows;

      return dataRows.map((row) => {
        const item = {};
        headers.forEach((header, index) => {
          item[header] = (row[index] || "").trim();
        });
        return item;
      });
    }

    async function loadCsvSource(key) {
      const source = SOURCES[key];
      const response = await fetch(source.csv, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(key + " CSV 응답 오류: " + response.status);
      }
      const text = await response.text();
      return rowsToObjects(parseCsv(text), source.columns);
    }

    async function loadAll() {
      setStatus("products, prices, basePrices를 가져오고 있습니다.", false);

      try {
        const [products, prices, basePrices] = await Promise.all([
          loadCsvSource("products"),
          loadCsvSource("prices"),
          loadCsvSource("basePrices")
        ]);
        await applyLoadedData(products, prices, basePrices);
      } catch (error) {
        setStatus("데이터를 불러오지 못했습니다. " + error.message, true);
        els.meta.textContent = "로드 실패";
        console.error(error);
      }
    }

    async function applyLoadedData(products, prices, basePrices) {
      const latestPrices = latestByCode(prices, "price");
      const latestBasePrices = latestByCode(basePrices, "basePrice");
      state.priceHistory = historyByCode(prices, "price");
      state.basePriceHistory = historyByCode(basePrices, "basePrice");

      state.products = products;
      state.rows = products.map((product) => {
        const code = cleanCode(product.code);
        const price = latestPrices.get(code);
        const basePrice = latestBasePrices.get(code);
        const currentPrice = price ? toNumber(price.price) : null;
        const currentBasePrice = basePrice ? toNumber(basePrice.basePrice) : null;

        return {
          code,
          name: product.name || "(이름 없음)",
          searchText: ((product.name || "") + " " + code).toLowerCase(),
          image: product.image || "",
          stock: product.stock || "",
          inStock: isInStock(product.stock),
          price: currentPrice,
          priceTimestamp: price ? parseDate(price.timestamp) : null,
          basePrice: currentBasePrice,
          basePriceTimestamp: basePrice ? parseDate(basePrice.timestamp) : null,
          delta: currentPrice !== null && currentBasePrice !== null ? currentPrice - currentBasePrice : null,
          discountRate: currentPrice !== null && currentBasePrice > 0
            ? ((currentBasePrice - currentPrice) / currentBasePrice) * 100
            : null
        };
      });

      state.loadedAt = new Date();
      state.defaultMaxPrice = Math.max(0, ...state.rows.map((row) => row.price || 0));
      await notifyPriceChanges(await detectPriceChanges(state.rows));
      await savePriceSnapshot(state.rows);
      setDefaultPriceRange();
      restoreStateFromUrl();
      await applyFilters();
      if (state.restoredHistoryCode) openHistory(state.restoredHistoryCode, false);
      state.isRestoring = false;
      updateUrlState();
      setReadyStatus();
      els.meta.textContent = "마지막 업데이트 " + dateFormatter.format(state.loadedAt);
      await updateNotificationUi();
    }

    function latestByCode(rows, valueKey) {
      const map = new Map();
      rows.forEach((row) => {
        const code = cleanCode(row.code);
        if (!code || toNumber(row[valueKey]) === null) return;
        const current = map.get(code);
        const nextDate = parseDate(row.timestamp);
        const currentDate = current ? parseDate(current.timestamp) : null;
        if (!current || compareDates(nextDate, currentDate) >= 0) {
          map.set(code, row);
        }
      });
      return map;
    }

    function historyByCode(rows, valueKey) {
      const map = new Map();
      rows.forEach((row) => {
        const code = cleanCode(row.code);
        const value = toNumber(row[valueKey]);
        const timestamp = parseDate(row.timestamp);
        if (!code || value === null || !timestamp) return;
        if (!map.has(code)) map.set(code, []);
        map.get(code).push({ value, timestamp });
      });
      map.forEach((items) => {
        items.sort((a, b) => compareDates(b.timestamp, a.timestamp));
      });
      return map;
    }

    function cleanCode(value) {
      return String(value || "").trim();
    }

    function toNumber(value) {
      const cleaned = String(value || "").replace(/[^\d.-]/g, "");
      if (!cleaned) return null;
      const number = Number(cleaned);
      return Number.isFinite(number) ? number : null;
    }

    function parseDate(value) {
      if (!value) return null;
      if (value instanceof Date) return value;
      const numeric = Number(String(value).trim());
      if (Number.isFinite(numeric)) {
        const milliseconds = numeric > 100000000000 ? numeric : numeric * 1000;
        const numericDate = new Date(milliseconds);
        if (!Number.isNaN(numericDate.getTime())) return numericDate;
      }
      const date = new Date(value);
      if (!Number.isNaN(date.getTime())) return date;

      const normalized = String(value).replace(/\./g, "-").replace(/\s+/g, " ").trim();
      const fallback = new Date(normalized);
      return Number.isNaN(fallback.getTime()) ? null : fallback;
    }

    function compareDates(a, b) {
      const at = a ? a.getTime() : 0;
      const bt = b ? b.getTime() : 0;
      return at - bt;
    }

    function isInStock(value) {
      const text = String(value || "").trim().toLowerCase();
      if (!text) return false;
      return !["0", "false", "no", "n", "품절", "없음", "out", "outofstock", "soldout"].includes(text.replace(/\s+/g, ""));
    }

    async function applyFilters(options = {}) {
      resetProductStatusFilterAvailability();
      if (options.resetProductStatus === true) {
        els.inStockOnlyInput.checked = true;
        els.discountOnlyInput.checked = true;
      }
      state.filtered = baseFilteredRows();
      state.filtered = disableEmptyProductStatusFilters(state.filtered) || state.filtered;

      const sorter = getSorter();
      if (sorter) state.filtered.sort(sorter);
      state.visibleCount = Math.min(Math.max(state.visibleCount, LOAD_BATCH_SIZE), state.filtered.length || LOAD_BATCH_SIZE);
      await render();
    }

    function resetProductStatusFilterAvailability() {
      els.inStockOnlyInput.disabled = false;
      els.discountOnlyInput.disabled = false;
    }

    function disableProductStatusFilter(input) {
      input.checked = false;
      input.disabled = true;
    }

    function disableEmptyProductStatusFilters(filteredRows) {
      if (filteredRows.length > 0 || (!els.inStockOnlyInput.checked && !els.discountOnlyInput.checked)) return null;

      if (els.discountOnlyInput.checked) {
        disableProductStatusFilter(els.discountOnlyInput);
        const withoutDiscount = baseFilteredRows();
        if (withoutDiscount.length > 0) {
          return withoutDiscount;
        }
      }

      if (els.inStockOnlyInput.checked) {
        disableProductStatusFilter(els.inStockOnlyInput);
        const withoutStock = baseFilteredRows();
        if (withoutStock.length > 0) {
          return withoutStock;
        }
      }

      return baseFilteredRows();
    }

    function baseFilteredRows() {
      const query = els.searchInput.value.trim().toLowerCase();
      const minPrice = parsePriceInput(els.minPriceInput.value, 0);
      const maxPrice = parsePriceInput(els.maxPriceInput.value, state.defaultMaxPrice);

      return state.rows.filter((row) => {
        const matchesQuery = !query || row.searchText.includes(query);
        const matchesMinPrice = minPrice === null || (row.price !== null && row.price >= minPrice);
        const matchesMaxPrice = maxPrice === null || (row.price !== null && row.price <= maxPrice);
        const matchesStock = !els.inStockOnlyInput.checked || row.inStock;
        const matchesDiscount = !els.discountOnlyInput.checked || (row.inStock && row.delta !== null && row.delta < 0);
        return matchesQuery && matchesMinPrice && matchesMaxPrice && matchesStock && matchesDiscount;
      });
    }

    function getSorter() {
      if (state.sortKey === "price") {
        const direction = state.sortDir === "asc" ? 1 : -1;
        return (a, b) => compareValues(a.price, b.price, direction);
      }
      if (state.sortKey === "discountRate") {
        const direction = state.sortDir === "asc" ? 1 : -1;
        return (a, b) => compareValues(a.discountRate, b.discountRate, direction);
      }
      return compareRowsByLatestPrice;
    }

    function compareRowsByLatestPrice(a, b) {
      return compareDates(b.priceTimestamp, a.priceTimestamp);
    }

    function compareValues(a, b, direction) {
      const aMissing = a === null || a === undefined || a === "";
      const bMissing = b === null || b === undefined || b === "";
      if (aMissing && bMissing) return 0;
      if (aMissing) return 1;
      if (bMissing) return -1;
      return direction * (a - b);
    }

    function parsePriceInput(value, fallback) {
      const text = String(value || "").trim();
      if (!text) return fallback;
      const number = Number(text);
      return Number.isFinite(number) && number >= 0 ? number : fallback;
    }

    function setDefaultPriceRange() {
      els.minPriceInput.value = "0";
      els.maxPriceInput.value = String(state.defaultMaxPrice);
      els.minPriceInput.max = String(state.defaultMaxPrice);
      els.maxPriceInput.max = String(state.defaultMaxPrice);
    }

    function clampPriceInputs() {
      const maxAllowed = state.defaultMaxPrice;
      const minPrice = parsePriceInput(els.minPriceInput.value, 0);
      const maxPrice = parsePriceInput(els.maxPriceInput.value, maxAllowed);
      els.minPriceInput.value = String(Math.min(minPrice, maxAllowed));
      els.maxPriceInput.value = String(Math.min(maxPrice, maxAllowed));
    }

    async function render() {
      const renderId = state.renderId + 1;
      state.renderId = renderId;
      const pageRows = state.filtered.slice(0, state.visibleCount);
      const alertCodes = await getAlertCodes();
      if (renderId !== state.renderId) return;
      els.rows.innerHTML = pageRows.map((row) => renderRow(row, alertCodes)).join("");
      els.empty.hidden = state.filtered.length !== 0;

      updateSortButtons();
      updateUrlState();
    }

    function loadMoreRows() {
      if (state.visibleCount >= state.filtered.length) return;
      state.visibleCount = Math.min(state.visibleCount + LOAD_BATCH_SIZE, state.filtered.length);
      render();
    }

    function maybeLoadMoreRows() {
      const remaining = document.documentElement.scrollHeight - window.innerHeight - window.scrollY;
      if (remaining < 500) loadMoreRows();
    }

    function scheduleSearchFilter() {
      window.clearTimeout(searchFilterTimer);
      searchFilterTimer = window.setTimeout(() => {
        state.visibleCount = LOAD_BATCH_SIZE;
        applyFilters({ resetProductStatus: true });
      }, SEARCH_DEBOUNCE_MS);
    }

    function defaultSortDir(key) {
      return "desc";
    }

    function toggledSortDir(key) {
      return defaultSortDir(key) === "asc" ? "desc" : "asc";
    }

    function setSort(key, shouldUpdateUrl) {
      if (!["price", "discountRate"].includes(key)) return;
      if (state.sortKey !== key) {
        state.sortKey = key;
        state.sortDir = defaultSortDir(key);
      } else if (state.sortDir === defaultSortDir(key)) {
        state.sortDir = toggledSortDir(key);
      } else {
        state.sortKey = "";
        state.sortDir = "";
      }
      state.visibleCount = LOAD_BATCH_SIZE;
      applyFilters();
      if (shouldUpdateUrl !== false) updateUrlState();
    }

    function updateSortButtons() {
      els.sortButtons.forEach((button) => {
        const active = button.dataset.sortKey === state.sortKey;
        button.setAttribute("aria-sort", active ? (state.sortDir === "asc" ? "ascending" : "descending") : "none");
      });
    }

    function renderRow(row, alertCodes) {
      const discountClass = row.discountRate === null ? "" : row.discountRate > 0 ? " down" : row.discountRate < 0 ? " up" : "";
      const historyCount = combinedHistory(row.code).length;
      const alertActive = alertCodes.has(row.code);
      const alertCell = state.canConfigureNotifications
        ? "<td data-label=\"알림\"><button class=\"alert-button" + (alertActive ? " active" : "") + "\" type=\"button\" data-alert-code=\"" + escapeAttribute(row.code) + "\" aria-pressed=\"" + String(alertActive) + "\">" + (alertActive ? "알림 중" : "알림 설정") + "</button></td>"
        : "";

      return [
        "<tr>",
        "<td><a class=\"product\" href=\"" + escapeAttribute(productUrl(row.code)) + "\" target=\"_blank\" rel=\"noopener noreferrer\">",
        renderImage(row),
        "<div class=\"product-text\"><div class=\"name\">" + escapeHtml(row.name) + "</div><div class=\"code-row\"><span class=\"code\">" + escapeHtml(row.code || "-") + "</span>" + stockChip(row) + "</div></div>",
        "</a></td>",
        "<td class=\"num\" data-label=\"현재가\">" + money(row.price) + "<span class=\"subtext\">" + escapeHtml(relativeTime(row.priceTimestamp)) + "</span></td>",
        "<td class=\"num delta" + discountClass + "\" data-label=\"할인율\">" + percent(row.discountRate) + "<span class=\"subtext\">&nbsp;</span></td>",
        "<td data-label=\"이력\"><button class=\"history-button\" type=\"button\" data-history-code=\"" + escapeAttribute(row.code) + "\">이력 " + numberFormatter.format(historyCount) + "</button></td>",
        alertCell,
        "</tr>"
      ].join("");
    }

    function openDb() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => {
          dbPromise = null;
          reject(request.error);
        };
      });
      return dbPromise;
    }

    async function getDbValue(key, fallback) {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const request = db.transaction(DB_STORE, "readonly").objectStore(DB_STORE).get(key);
        request.onsuccess = () => resolve(request.result === undefined ? fallback : request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function setDbValue(key, value) {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const request = db.transaction(DB_STORE, "readwrite").objectStore(DB_STORE).put(value, key);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    }

    async function getAlertCodes() {
      try {
        const saved = await getDbValue(STORAGE_KEYS.alertCodes, []);
        return new Set(Array.isArray(saved) ? saved.map(cleanCode).filter(Boolean) : []);
      } catch (error) {
        console.warn("알림 설정을 불러오지 못했습니다.", error);
        return new Set();
      }
    }

    async function setAlertCodes(alertCodes) {
      await setDbValue(STORAGE_KEYS.alertCodes, [...alertCodes]);
    }

    async function toggleAlert(code) {
      const clean = cleanCode(code);
      if (!clean) return;
      await updateNotificationUi();
      if (!state.canConfigureNotifications) {
        await render();
        return;
      }
      const alertCodes = await getAlertCodes();
      if (!alertCodes.has(clean)) {
        const enabled = await enableNotifications();
        if (!enabled) {
          showNotice(Notification.permission === "default"
            ? "브라우저 알림 권한 요청을 먼저 허용해 주세요."
            : "알림 권한이 허용되지 않아 상품 알림을 설정하지 않았습니다.");
          await render();
          return;
        }
        alertCodes.add(clean);
      } else {
        alertCodes.delete(clean);
      }
      await setAlertCodes(alertCodes);
      await savePriceSnapshot(state.rows);
      await registerPeriodicPriceCheck();
      requestServiceWorkerPriceCheck();
      await updateNotificationUi();
      await render();
    }

    async function readPriceSnapshot() {
      try {
        const saved = await getDbValue(STORAGE_KEYS.priceSnapshot, {});
        return saved && typeof saved === "object" ? saved : {};
      } catch (error) {
        return {};
      }
    }

    async function savePriceSnapshot(rows) {
      const alertCodes = await getAlertCodes();
      const snapshot = {};
      rows.forEach((row) => {
        if (!row.code || !alertCodes.has(row.code)) return;
        snapshot[row.code] = {
          price: row.price,
          basePrice: row.basePrice,
          name: row.name,
          updatedAt: row.priceTimestamp ? row.priceTimestamp.toISOString() : null
        };
      });
      await setDbValue(STORAGE_KEYS.priceSnapshot, snapshot);
    }

    async function detectPriceChanges(rows) {
      const previous = await readPriceSnapshot();
      const alertCodes = await getAlertCodes();
      return rows
        .filter((row) => alertCodes.has(row.code))
        .map((row) => {
          const old = previous[row.code];
          if (!old || old.price === null || row.price === null || old.price === row.price) return null;
          return {
            code: row.code,
            name: row.name,
            oldPrice: old.price,
            newPrice: row.price,
            direction: row.price > old.price ? "up" : "down"
          };
        })
        .filter(Boolean);
    }

    async function notifyPriceChanges(changes) {
      if (!changes.length || !canShowNotifications()) return;
      await ensureServiceWorker();
      const visibleChanges = changes.slice(0, 5);
      visibleChanges.forEach((change) => {
        showAppNotification(
          change.direction === "down" ? "가격이 내려갔습니다" : "가격이 올랐습니다",
          change.name + "\n" + money(change.oldPrice) + " → " + money(change.newPrice),
          { productCode: change.code, url: productUrl(change.code) }
        );
      });
      if (changes.length > visibleChanges.length) {
        showAppNotification("가격 변동 알림", "추가 " + numberFormatter.format(changes.length - visibleChanges.length) + "개 상품의 가격이 바뀌었습니다.", {});
      }
    }

    function canShowNotifications() {
      return "Notification" in window && Notification.permission === "granted";
    }

    function canConfigureNotifications() {
      return "Notification" in window && Notification.permission !== "denied";
    }

    async function ensureServiceWorker() {
      if (!("serviceWorker" in navigator)) return null;
      if (state.serviceWorkerRegistration) return state.serviceWorkerRegistration;
      try {
        state.serviceWorkerRegistration = await navigator.serviceWorker.register("sw.js");
        return state.serviceWorkerRegistration;
      } catch (error) {
        console.warn("서비스워커를 등록하지 못했습니다.", error);
        return null;
      }
    }

    async function enableNotifications() {
      if (!("Notification" in window)) {
        await updateNotificationUi();
        return false;
      }
      if (Notification.permission === "denied") {
        await updateNotificationUi();
        return false;
      }
      if (Notification.permission === "default") {
        if (state.notificationPermissionPromptDismissed) {
          await updateNotificationUi();
          return false;
        }
        try {
          await Notification.requestPermission();
          if (Notification.permission === "default") {
            state.notificationPermissionPromptDismissed = true;
          }
        } catch (error) {
          console.warn("알림 권한을 요청하지 못했습니다.", error);
          state.notificationPermissionPromptDismissed = true;
        }
      }
      if (Notification.permission === "granted") {
        state.notificationPermissionPromptDismissed = false;
        await ensureServiceWorker();
        await registerPeriodicPriceCheck();
        requestServiceWorkerPriceCheck();
      }
      await updateNotificationUi();
      return Notification.permission === "granted";
    }

    async function registerPeriodicPriceCheck() {
      const registration = await ensureServiceWorker();
      if (!registration || !("periodicSync" in registration) || !canShowNotifications()) return false;
      try {
        await registration.periodicSync.register("price-check", { minInterval: PRICE_CHECK_INTERVAL_MS });
        return true;
      } catch (error) {
        console.warn("백그라운드 주기 확인을 등록하지 못했습니다.", error);
        return false;
      }
    }

    function requestServiceWorkerPriceCheck() {
      if (!state.serviceWorkerRegistration || !state.serviceWorkerRegistration.active) return;
      state.serviceWorkerRegistration.active.postMessage({ type: "CHECK_PRICES" });
    }

    function showAppNotification(title, body, data) {
      const options = {
        body,
        tag: data.productCode ? "costco-price-" + data.productCode : "costco-price-summary",
        data,
        icon: "icon.svg",
        badge: "icon.svg"
      };
      if (state.serviceWorkerRegistration) {
        state.serviceWorkerRegistration.showNotification(title, options);
      } else {
        new Notification(title, options);
      }
    }

    async function updateNotificationUi() {
      state.canConfigureNotifications = canConfigureNotifications();
      els.alertColumnHeader.hidden = !state.canConfigureNotifications;
    }

    function openHistory(code, shouldUpdateUrl) {
      const row = state.rows.find((item) => item.code === code);
      if (!row) return;
      const entries = combinedHistory(code);
      els.historyTitle.textContent = row.name;
      els.historySubtitle.textContent = row.code + " · " + entries.length + "개 시점";
      els.historyChart.innerHTML = renderHistoryChart(entries);
      els.historyRows.innerHTML = entries.map(renderHistoryRow).join("");
      els.historyEmpty.hidden = entries.length !== 0;
      els.historyModal.hidden = false;
      state.restoredHistoryCode = code;
      if (shouldUpdateUrl !== false) updateUrlState();
    }

    function closeHistory(shouldUpdateUrl) {
      els.historyModal.hidden = true;
      state.restoredHistoryCode = "";
      if (shouldUpdateUrl !== false) updateUrlState();
    }

    function combinedHistory(code) {
      const byTime = new Map();
      (state.priceHistory.get(code) || []).forEach((item) => {
        const key = String(item.timestamp.getTime());
        if (!byTime.has(key)) byTime.set(key, { timestamp: item.timestamp, price: null, basePrice: null, hasPrice: false, hasBasePrice: false });
        const entry = byTime.get(key);
        entry.price = item.value;
        entry.hasPrice = true;
      });
      (state.basePriceHistory.get(code) || []).forEach((item) => {
        const key = String(item.timestamp.getTime());
        if (!byTime.has(key)) byTime.set(key, { timestamp: item.timestamp, price: null, basePrice: null, hasPrice: false, hasBasePrice: false });
        const entry = byTime.get(key);
        entry.basePrice = item.value;
        entry.hasBasePrice = true;
      });

      let lastPrice = null;
      let lastBasePrice = null;
      return [...byTime.values()]
        .sort((a, b) => compareDates(a.timestamp, b.timestamp))
        .map((entry) => {
          if (entry.hasPrice) lastPrice = entry.price;
          else entry.price = lastPrice;
          if (entry.hasBasePrice) lastBasePrice = entry.basePrice;
          else entry.basePrice = lastBasePrice;
          return entry;
        })
        .sort((a, b) => compareDates(b.timestamp, a.timestamp));
    }

    function renderHistoryRow(entry) {
      const rate = entry.price !== null && entry.basePrice > 0
        ? ((entry.basePrice - entry.price) / entry.basePrice) * 100
        : null;
      const rateClass = rate === null ? "" : rate > 0 ? " down" : rate < 0 ? " up" : "";
      return [
        "<tr>",
        "<td data-label=\"시각\">" + dateText(entry.timestamp) + "</td>",
        "<td class=\"num\" data-label=\"기준가\">" + money(entry.basePrice) + "</td>",
        "<td class=\"num\" data-label=\"현재가\">" + money(entry.price) + "</td>",
        "<td class=\"num delta" + rateClass + "\" data-label=\"할인율\">" + percent(rate) + "</td>",
        "</tr>"
      ].join("");
    }

    function renderHistoryChart(entries) {
      const chartEntries = entries.slice().reverse();
      const points = chartEntries.flatMap((entry) => [entry.price, entry.basePrice]).filter((value) => value !== null);
      if (points.length === 0) return "";

      const width = 860;
      const height = 260;
      const pad = { top: 20, right: 24, bottom: 34, left: 72 };
      const min = Math.min(...points);
      const max = Math.max(...points);
      const span = max - min || 1;
      const xEnd = width - pad.right;
      const firstTime = startOfSeoulDay(chartEntries[0].timestamp).getTime();
      const nowTime = Date.now();
      const lastTime = Math.max(nowTime, chartEntries[chartEntries.length - 1].timestamp.getTime());
      const timeSpan = Math.max(1, lastTime - firstTime);
      const yFor = (value) => pad.top + ((max - value) / span) * (height - pad.top - pad.bottom);
      const xFor = (date) => pad.left + ((date.getTime() - firstTime) / timeSpan) * (xEnd - pad.left);
      const pricePoints = chartEntries.map((entry) => entry.price === null ? null : [xFor(entry.timestamp), yFor(entry.price)]);
      const basePoints = chartEntries.map((entry) => entry.basePrice === null ? null : [xFor(entry.timestamp), yFor(entry.basePrice)]);
      const xLabels = chartDateLabels(chartEntries, xFor, pad.left, xEnd, new Date(firstTime));
      xLabels.push({ text: "지금", x: xEnd, anchor: "end" });
      const midY = yFor((min + max) / 2);

      return [
        "<svg class=\"history-chart\" viewBox=\"0 0 " + width + " " + height + "\" role=\"img\" aria-label=\"가격 이력 그래프\">",
        "<line x1=\"" + pad.left + "\" y1=\"" + pad.top + "\" x2=\"" + pad.left + "\" y2=\"" + (height - pad.bottom) + "\" stroke=\"#cbd5e1\" />",
        "<line x1=\"" + pad.left + "\" y1=\"" + (height - pad.bottom) + "\" x2=\"" + xEnd + "\" y2=\"" + (height - pad.bottom) + "\" stroke=\"#cbd5e1\" />",
        axisLabel(money(max), 8, pad.top + 4),
        axisLabel(money(Math.round((min + max) / 2)), 8, midY + 4),
        axisLabel(money(min), 8, height - pad.bottom + 4),
        "<line x1=\"" + pad.left + "\" y1=\"" + midY + "\" x2=\"" + xEnd + "\" y2=\"" + midY + "\" stroke=\"#e2e8f0\" stroke-dasharray=\"4 5\" />",
        stepPath(basePoints, "#c2410c", xEnd),
        stepPath(pricePoints, "#0f766e", xEnd),
        dots(basePoints, "#c2410c"),
        dots(pricePoints, "#0f766e"),
        xLabels.map((label) => axisLabel(label.text, label.x, height - 10, label.anchor)).join(""),
        "</svg>"
      ].join("");
    }

    function chartDateLabels(entries, xFor, xStart, xEnd, startDate) {
      const minGap = 92;
      const labels = [{ text: shortDate(startDate), x: xStart, anchor: "start" }];
      entries.forEach((entry) => {
        const text = shortDate(entry.timestamp);
        const x = xFor(entry.timestamp);
        const last = labels[labels.length - 1];
        if (!last || (text !== last.text && x - last.x >= minGap && xEnd - x >= minGap)) {
          labels.push({ text, x, anchor: labelAnchor(x, xEnd) });
        }
      });
      const lastText = shortDate(entries[entries.length - 1].timestamp);
      const last = labels[labels.length - 1];
      if (last.text !== lastText && xEnd - last.x >= minGap) {
        const x = xFor(entries[entries.length - 1].timestamp);
        labels.push({ text: lastText, x, anchor: labelAnchor(x, xEnd) });
      }
      return labels;
    }

    function startOfSeoulDay(date) {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Seoul",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(date);
      const values = Object.fromEntries(parts.map((part) => [part.type, part.value]));
      return new Date(Date.UTC(Number(values.year), Number(values.month) - 1, Number(values.day), -9, 0, 0, 0));
    }

    function labelAnchor(x, xEnd) {
      if (x < 112) return "start";
      if (xEnd - x < 112) return "end";
      return "middle";
    }

    function stepPath(points, color, xEnd) {
      const values = points.filter(Boolean);
      if (!values.length) return "";
      const commands = ["M " + values[0][0].toFixed(1) + " " + values[0][1].toFixed(1)];
      for (let i = 1; i < values.length; i += 1) {
        commands.push("H " + values[i][0].toFixed(1));
        commands.push("V " + values[i][1].toFixed(1));
      }
      commands.push("H " + xEnd.toFixed(1));
      return "<path d=\"" + commands.join(" ") + "\" fill=\"none\" stroke=\"" + color + "\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" />";
    }

    function dots(points, color) {
      return points.filter(Boolean).map((point) => (
        "<circle cx=\"" + point[0].toFixed(1) + "\" cy=\"" + point[1].toFixed(1) + "\" r=\"3.5\" fill=\"" + color + "\" />"
      )).join("");
    }

    function axisLabel(text, x, y, anchor) {
      return "<text x=\"" + x + "\" y=\"" + y + "\" text-anchor=\"" + (anchor || "start") + "\" fill=\"#64748b\" font-size=\"12\">" + escapeHtml(text) + "</text>";
    }

    function shortDate(value) {
      return new Intl.DateTimeFormat("ko-KR", {
        timeZone: "Asia/Seoul",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(value);
    }

    function productUrl(code) {
      return "http://costco.co.kr/p/" + encodeURIComponent(code || "");
    }

    function renderImage(row) {
      const src = imageUrl(row.image);
      if (!src) return "<div class=\"thumb missing\">NO IMG</div>";
      return "<img class=\"thumb\" src=\"" + escapeAttribute(src) + "\" alt=\"\" loading=\"lazy\" onerror=\"this.replaceWith(Object.assign(document.createElement('div'),{className:'thumb missing',textContent:'NO IMG'}))\">";
    }

    function imageUrl(value) {
      const src = String(value || "").trim();
      if (!src) return "";
      if (/^https?:\/\//i.test(src)) return src;
      if (src.startsWith("//")) return "https:" + src;
      if (src.startsWith("/")) return "https://www.costco.co.kr" + src;
      return src;
    }

    function stockChip(row) {
      return row.inStock ? "" : "<span class=\"chip off\">품절</span>";
    }

    function money(value) {
      return value === null ? "-" : moneyFormatter.format(value);
    }

    function percent(value) {
      if (value === null) return "-";
      return value.toFixed(1) + "%";
    }

    function dateText(value) {
      return value ? dateFormatter.format(value) : "-";
    }

    function relativeTime(value) {
      if (!value) return "";
      const seconds = Math.max(0, Math.floor((Date.now() - value.getTime()) / 1000));
      if (seconds < 60) return "방금";
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return minutes + "분 전";
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return hours + "시간 전";
      const days = Math.floor(hours / 24);
      if (days < 30) return days + "일 전";
      const months = Math.floor(days / 30);
      if (months < 12) return months + "개월 전";
      return Math.floor(months / 12) + "년 전";
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/`/g, "&#096;");
    }

    function resetFilters() {
      els.searchInput.value = "";
      resetProductStatusFilterAvailability();
      els.inStockOnlyInput.checked = true;
      els.discountOnlyInput.checked = true;
      setDefaultPriceRange();
      state.sortKey = "";
      state.sortDir = "";
      state.visibleCount = LOAD_BATCH_SIZE;
      closeHistory(false);
      applyFilters();
    }

    function restoreStateFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const min = params.get("min");
      const max = params.get("max");
      const history = params.get("history");
      const stock = params.get("stock");
      const discount = params.get("discount");
      const sortKey = params.get("sort");
      const sortDir = params.get("dir");

      els.searchInput.value = params.get("q") || "";
      els.inStockOnlyInput.checked = stock !== "0";
      els.discountOnlyInput.checked = discount !== "0";
      if (min !== null) els.minPriceInput.value = String(Math.max(0, Number(min) || 0));
      if (max !== null) {
        const maxValue = Number(max);
        els.maxPriceInput.value = String(Number.isFinite(maxValue) ? Math.min(state.defaultMaxPrice, Math.max(0, maxValue)) : state.defaultMaxPrice);
      }
      clampPriceInputs();
      if (["price", "discountRate"].includes(sortKey)) {
        state.sortKey = sortKey;
        state.sortDir = sortDir === toggledSortDir(sortKey) ? sortDir : defaultSortDir(sortKey);
      }
      state.restoredHistoryCode = history ? cleanCode(history) : "";
    }

    function updateUrlState() {
      if (state.isRestoring) return;
      const params = new URLSearchParams();
      const query = els.searchInput.value.trim();
      const min = parsePriceInput(els.minPriceInput.value, 0);
      const max = parsePriceInput(els.maxPriceInput.value, state.defaultMaxPrice);

      if (query) params.set("q", query);
      if (!els.inStockOnlyInput.checked) params.set("stock", "0");
      if (!els.discountOnlyInput.checked) params.set("discount", "0");
      if (min !== 0) params.set("min", String(min));
      if (max !== state.defaultMaxPrice) params.set("max", String(max));
      if (state.sortKey) {
        params.set("sort", state.sortKey);
        params.set("dir", state.sortDir);
      }
      if (!els.historyModal.hidden && state.restoredHistoryCode) params.set("history", state.restoredHistoryCode);

      const queryString = params.toString();
      const nextUrl = window.location.pathname + (queryString ? "?" + queryString : "") + window.location.hash;
      window.history.replaceState(null, "", nextUrl);
    }

    els.searchInput.addEventListener("input", () => {
      scheduleSearchFilter();
    });
    els.minPriceInput.addEventListener("input", () => {
      clampPriceInputs();
      state.visibleCount = LOAD_BATCH_SIZE;
      applyFilters();
    });
    els.maxPriceInput.addEventListener("input", () => {
      clampPriceInputs();
      state.visibleCount = LOAD_BATCH_SIZE;
      applyFilters();
    });
    els.inStockOnlyInput.addEventListener("change", () => {
      state.visibleCount = LOAD_BATCH_SIZE;
      applyFilters();
    });
    els.discountOnlyInput.addEventListener("change", () => {
      state.visibleCount = LOAD_BATCH_SIZE;
      applyFilters();
    });
    els.resetButton.addEventListener("click", resetFilters);
    els.titleResetButton.addEventListener("click", resetFilters);
    els.rows.addEventListener("click", async (event) => {
      const alertButton = event.target.closest("[data-alert-code]");
      if (alertButton) {
        alertButton.disabled = true;
        try {
          await toggleAlert(alertButton.dataset.alertCode);
        } finally {
          if (alertButton.isConnected) alertButton.disabled = false;
        }
        return;
      }
      const button = event.target.closest("[data-history-code]");
      if (button) openHistory(button.dataset.historyCode);
    });
    els.historyCloseButton.addEventListener("click", closeHistory);
    els.historyModal.addEventListener("click", (event) => {
      if (event.target === els.historyModal) closeHistory();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !els.historyModal.hidden) closeHistory();
    });
    window.addEventListener("scroll", maybeLoadMoreRows, { passive: true });
    els.sortButtons.forEach((button) => {
      button.addEventListener("click", () => setSort(button.dataset.sortKey));
    });
    async function init() {
      await ensureServiceWorker();
      await registerPeriodicPriceCheck();
      await updateNotificationUi();
      loadAll();
      window.setInterval(requestServiceWorkerPriceCheck, PRICE_CHECK_INTERVAL_MS);
    }

    init();
  </script>
</body>
</html>
